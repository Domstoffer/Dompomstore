<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout – Dompomstore</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Montserrat',sans-serif;
  background:#fff;
  color:#111;
}

/* HEADER */
header{
  padding:18px 0;
  text-align:center;
  font-size:1.4rem;
  font-weight:500;
  letter-spacing:0.25em;
  position:relative;
}

.back-link{
  position:absolute;
  left:25px;
  top:50%;
  transform:translateY(-50%);
  font-size:12px;
  letter-spacing:0.1em;
  text-decoration:none;
  color:#111;
}

/* CONTAINER */
.checkout-container{
  max-width:480px;
  margin:100px auto 120px auto;
  padding:0 30px;
}

.checkout-title{
  text-align:center;
  font-size:18px;
  letter-spacing:0.2em;
  margin-bottom:40px;
}

/* ORDER SUMMARY */
.order-summary{
  margin-bottom:50px;
  text-align:center;
}

.order-summary-title{
  font-size:13px;
  letter-spacing:0.15em;
  margin-bottom:20px;
}

.order-item{
  font-size:14px;
  margin-bottom:8px;
}

.order-total{
  margin-top:20px;
  font-weight:500;
  letter-spacing:0.1em;
}

/* FORM */
form{
  display:flex;
  flex-direction:column;
  gap:18px;
}

input{
  border:none;
  border-bottom:1px solid rgba(0,0,0,0.2);
  padding:12px 4px;
  font-size:14px;
  letter-spacing:0.05em;
  outline:none;
  background:transparent;
}

input:focus{
  border-bottom:1px solid #000;
}

/* BUTTON */
button{
  margin-top:30px;
  padding:14px;
  border:none;
  background:#000;
  color:#fff;
  letter-spacing:0.15em;
  font-weight:500;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  background:#111;
}

/* MOBILE */
@media(max-width:768px){
  .checkout-container{
    margin:80px auto;
  }
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="back-link">← ZURÜCK</a>
  DOMPOMSTORE
</header>

<div class="checkout-container">

  <!-- BESTELLÜBERSICHT -->
  <div id="orderSummary" class="order-summary"></div>

  <div class="checkout-title">VERSANDINFORMATIONEN</div>

  <form id="checkoutForm">
    <input required name="firstname" placeholder="Vorname">
    <input required name="lastname" placeholder="Nachname">
    <input required name="street" placeholder="Straße & Hausnummer">
    <input required name="zip" placeholder="Postleitzahl">
    <input required name="city" placeholder="Stadt">
    <input required name="country" placeholder="Land">
    <input name="email" type="email" placeholder="Email (optional)">
    <button type="submit">WEITER ZUR ZAHLUNG</button>
  </form>

</div>

<script>
const cart = JSON.parse(localStorage.getItem("cart")) || [];
const summaryEl = document.getElementById("orderSummary");

/* Leeren Warenkorb abfangen */
if(cart.length === 0){
  window.location.href = "index.html";
}

/* Bestellübersicht aufbauen */
let total = 0;
let itemsHTML = "";

cart.forEach(item=>{
  total += item.price;
  itemsHTML += `<div class="order-item">${item.name} – ${item.price} $</div>`;
});

summaryEl.innerHTML = `
  <div class="order-summary-title">BESTELLUNG</div>
  ${itemsHTML}
  <div class="order-total">GESAMT: ${total} $</div>
`;

/* Formular */
document.getElementById("checkoutForm").addEventListener("submit", e => {
  e.preventDefault();

  const data = Object.fromEntries(new FormData(e.target).entries());
  localStorage.setItem("shipping", JSON.stringify(data));

  window.location.href = "pay.html";
});
</script>

</body>
</html>
