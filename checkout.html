<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout – Dompomstore</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Montserrat',sans-serif;
  background:#fff;
  color:#111;
}

/* HEADER */
header{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px 0;
  font-size:0.95rem;
  font-weight:500;
  letter-spacing:0.3em;
}

header span{
  pointer-events:none;
}

.back-link{
  position:absolute;
  left:18px;
  top:50%;
  transform:translateY(-50%);
  font-size:11px;
  letter-spacing:0.1em;
  text-decoration:none;
  color:#111;
  opacity:0.6;
  background:#fff;   /* verhindert visuelles Überlappen */
  padding-right:6px;
}

.back-link:hover{
  opacity:1;
}

/* CONTAINER */
.checkout-container{
  max-width:520px;
  margin:60px auto 100px auto;
  padding:0 24px;
}

.checkout-title{
  text-align:center;
  font-size:16px;
  letter-spacing:0.35em;
  margin:40px 0 30px 0;
}

/* ORDER SUMMARY */
.order-summary{
  margin:40px 0 50px 0;
  border-top:1px solid rgba(0,0,0,0.1);
  border-bottom:1px solid rgba(0,0,0,0.1);
}

.order-summary-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 0;
  font-size:12px;
  letter-spacing:0.35em;
  cursor:pointer;
}

.order-summary-content{
  overflow:hidden;
  max-height:0;
  transition:max-height .4s ease;
}

.order-item{
  font-size:15px;
  margin-bottom:14px;
}

.order-total{
  margin:20px 0 25px 0;
  font-weight:700;
  letter-spacing:0.25em;
  font-size:16px;
}

/* FORM */
form{
  display:flex;
  flex-direction:column;
  gap:28px;
}

input{
  border:none;
  border-bottom:1px solid rgba(0,0,0,0.25);
  padding:16px 2px;
  font-size:15px;
  letter-spacing:0.08em;
  outline:none;
  background:transparent;
}

input:focus{
  border-bottom:1px solid #000;
}

/* BUTTON */
button{
  margin-top:40px;
  padding:18px;
  border:none;
  background:#000;
  color:#fff;
  letter-spacing:0.25em;
  font-weight:500;
  font-size:13px;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  background:#111;
}

/* DESKTOP OPTIMIERUNG */
@media(min-width:900px){

  header{
    font-size:1.4rem;
  }

  .checkout-container{
    margin:120px auto;
  }

  .checkout-title{
    font-size:18px;
  }
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="back-link">← ZURÜCK</a>
  <span>DOMPOMSTORE</span>
</header>

<div class="checkout-container">

  <!-- BESTELLÜBERSICHT -->
  <div class="order-summary">

  <div class="order-summary-header" onclick="toggleSummary()">
    <span>BESTELLUNG</span>
    <span id="summaryToggle">+</span>
  </div>

  <div id="summaryContent" class="order-summary-content"></div>

</div>

  <div class="checkout-title">VERSANDINFORMATIONEN</div>

  <form id="checkoutForm">
    <input required name="firstname" placeholder="Vorname">
    <input required name="lastname" placeholder="Nachname">
    <input required name="street" placeholder="Straße & Hausnummer">
    <input required name="zip" placeholder="Postleitzahl">
    <input required name="city" placeholder="Stadt">
    <input required name="country" placeholder="Land">
    <input name="email" type="email" placeholder="Email (optional)">
    <button type="submit">WEITER ZUR ZAHLUNG</button>
  </form>

</div>

<script>
const cart = JSON.parse(localStorage.getItem("cart")) || [];
const summaryContent = document.getElementById("summaryContent");

if(cart.length === 0){
  window.location.href = "index.html";
}

let total = 0;
let itemsHTML = "";

cart.forEach(item=>{
  total += item.price;
  itemsHTML += `<div class="order-item">${item.name} – ${item.price} USDC</div>`;
});

summaryContent.innerHTML = `
  ${itemsHTML}
  <div class="order-total">GESAMT: ${total} USDC</div>
`;

function toggleSummary(){
  const content = document.getElementById("summaryContent");
  const toggle = document.getElementById("summaryToggle");

  if(content.style.maxHeight && content.style.maxHeight !== "0px"){
    content.style.maxHeight = "0px";
    toggle.innerText = "+";
  } else {
    content.style.maxHeight = content.scrollHeight + "px";
    toggle.innerText = "−";
  }
}

document.getElementById("checkoutForm").addEventListener("submit", e => {
  e.preventDefault();

  const data = Object.fromEntries(new FormData(e.target).entries());
  localStorage.setItem("shipping", JSON.stringify(data));

  window.location.href = "pay.html";
});

window.addEventListener("load", () => {
  toggleSummary();
});
</script>

</body>
</html>
