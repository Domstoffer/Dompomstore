<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Payment</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Montserrat', sans-serif;
  background: #f5f5f7;
  color: #111;
  display: flex;
  justify-content: center;
  padding: 20px;
}
.wrapper { width: 100%; max-width: 420px; }
.back { font-size: 12px; color: #666; text-decoration: none; display: inline-block; margin-bottom: 16px; }
.box { background: #fff; padding: 28px; border-radius: 22px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
h1 { text-align: center; font-size: 22px; margin-bottom: 6px; }
.sub { text-align: center; font-size: 13px; color: #666; margin-bottom: 20px; }
.summary { background: #fafafa; border-radius: 14px; padding: 14px; font-size: 14px; line-height: 1.6; border: 1px solid #eee; margin-bottom: 10px; }
.total { text-align: right; font-weight: 700; font-size: 15px; color: #0a8f6a; margin-bottom: 18px; }
.wallet { background: #fafafa; padding: 14px; border-radius: 14px; font-size: 12px; word-break: break-all; text-align: center; border: 1px solid #e5e5e5; cursor: pointer; margin-bottom: 12px; }
.qr { display: flex; justify-content: center; margin-bottom: 14px; }
.hint { font-size: 12px; color: #666; text-align: center; margin-bottom: 22px; }
button { width: 100%; padding: 16px; border-radius: 16px; border: none; background: linear-gradient(135deg, #00d18f, #00a56f); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
</style>
</head>

<body>

<div class="wrapper">
  <a class="back" href="javascript:history.back()">← Zurück</a>

  <div class="box">
    <h1>Crypto Payment</h1>
    <div class="sub">Solana · USDC</div>

    <div class="summary" id="summary"></div>
    <div class="total" id="total"></div>

    <div class="wallet" id="wallet">Lädt Wallet…</div>

    <div class="qr">
      <img id="qr" width="180" height="180">
    </div>

    <div class="hint">
      Bitte sende den <strong>exakten Betrag</strong><br>
      Danach „Ich habe bezahlt“ klicken
    </div>

    <button id="paidBtn">Ich habe bezahlt</button>
  </div>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart") || "[]");
let shipping = JSON.parse(localStorage.getItem("shipping") || "{}");

const summary = document.getElementById("summary");
const totalDiv = document.getElementById("total");
const walletDiv = document.getElementById("wallet");
const qrImg = document.getElementById("qr");
const paidBtn = document.getElementById("paidBtn");

function parsePrice(value) {
  if (typeof value === "number") return value;
  if (typeof value === "string") {
    const match = value.replace(",", ".").match(/\d+(\.\d+)?/);
    return match ? parseFloat(match[0]) : 0;
  }
  return 0;
}

let total = 0;
summary.innerHTML = "";

if (cart.length === 0) {
  summary.innerHTML = "Dein Warenkorb ist leer.";
} else {
  cart.forEach(item => {
    const price = parsePrice(item.price);
    const qty = Number(item.quantity) || 1;
    const sum = price * qty;
    total += sum;

    summary.innerHTML += `
      ${item.name} × ${qty}<br>
      <strong>${sum.toFixed(2)} USDC</strong>
      <hr style="border:none;border-top:1px solid #eee;margin:8px 0">
    `;
  });

  totalDiv.textContent = `Gesamtbetrag: ${total.toFixed(2)} USDC`;
}

const wallet = "HIER_DEINE_SOLANA_WALLET";
walletDiv.textContent = wallet;
qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${wallet}`;

walletDiv.onclick = () => {
  navigator.clipboard.writeText(wallet);
  alert("Wallet-Adresse kopiert");
};

paidBtn.onclick = async () => {

  if (cart.length === 0) {
    alert("Warenkorb leer.");
    return;
  }

  if (!shipping.firstname || !shipping.lastname || !shipping.street) {
    alert("Versanddaten fehlen.");
    return;
  }

  const order = {
    timestamp: Date.now(),
    cart: cart,
    shipping: shipping,
    total: total,
    currency: "USDC",
    website: ""
  };

  try {
    const response = await fetch("/panel_9xA3kQ/admin.php", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(order)
    });

    if (!response.ok) {
      alert("Fehler beim Senden der Bestellung.");
      return;
    }

    localStorage.removeItem("cart");
    localStorage.removeItem("shipping");

    location.href = "thankyou.html";

  } catch (error) {
    alert("Netzwerkfehler.");
  }
};
</script>

</body>
</html>
