<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Crypto Payment</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

<style>
body { margin:0; font-family:'Montserrat',sans-serif; background:#f5f5f7; color:#111; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:20px; }
.back-top { display:inline-block; font-size:12px; color:#555; text-decoration:none; border-bottom:1px solid transparent; transition:0.3s; margin-bottom:20px; }
.back-top:hover { border-color:#555; }
.container { display:flex; justify-content:space-between; align-items:flex-start; width:100%; max-width:1000px; gap:40px; flex-wrap:nowrap; }
.box, .contact-form { background:#fff; padding:30px 36px; border-radius:22px; width:420px; box-shadow:0 10px 40px rgba(0,0,0,0.08); }
h1, .contact-form h2 { text-align:center; }
h1 { font-size:24px; margin-bottom:10px; font-weight:700; letter-spacing:0.5px; }
.sub { font-size:13px; color:#666; margin-bottom:20px; text-align:center; }
.summary { background:#fafafa; border-radius:16px; padding:18px; margin-bottom:10px; font-size:14px; line-height:1.6; border:1px solid #eee; text-align:left; }
.summary strong { color:#0a8f6a; }
.total-price { font-size:16px; font-weight:700; text-align:right; margin-bottom:20px; color:#0a8f6a; }
input { width:100%; padding:14px; border-radius:14px; border:1px solid #ddd; font-size:14px; margin-bottom:18px; font-weight:600; background:#fff; }
.wallet { background:#fafafa; padding:14px; border-radius:14px; font-size:12px; word-break:break-all; margin-bottom:8px; border:1px solid #e5e5e5; text-align:center; cursor:pointer; }
.qr { background:#fff; padding:12px; border-radius:16px; display:flex; justify-content:center; margin-bottom:8px; border:1px solid #eee; }
.hint { font-size:12px; color:#666; margin-bottom:26px; text-align:center; }
button#finishPayment { width:100%; padding:16px; border-radius:16px; border:none; background:linear-gradient(135deg, #00d18f, #00a56f); color:#fff; font-size:16px; font-weight:700; text-transform:uppercase; letter-spacing:1px; cursor:pointer; margin-top:20px; }
button#finishPayment:hover { opacity:0.95; }
@media(max-width:900px){ .container{ flex-direction:column; align-items:center; } .box,.contact-form{ width:100%; max-width:420px; } button#finishPayment{ margin-top:15px; } }
</style>
</head>

<body>

<a class="back-top" href="javascript:history.back()">← Zurück zur vorherigen Seite</a>

<div class="container">

  <div class="box">
    <h1>Secure Crypto Payment</h1>
    <div class="sub">Solana Network · Fast & Secure</div>

    <div class="summary" id="summaryBox"></div>
    <div class="total-price" id="totalPrice"></div>

    <!-- Wallet kopierbar -->
    <div class="wallet" id="walletAddress" title="Klicken zum Kopieren">Lädt...</div>

    <div class="qr">
      <img id="qrCode" src="" alt="QR Code">
    </div>

    <div class="hint">
      Bitte senden Sie den <strong>exakten Betrag</strong>
    </div>
  </div>

  <div class="contact-form">
    <h2>Versandinformationen</h2>
    <form id="contactForm">
      <input type="text" name="firstname" placeholder="Vorname" required>
      <input type="text" name="lastname" placeholder="Nachname" required>
      <input type="text" name="street" placeholder="Straße" required>
      <input type="text" name="zip" placeholder="Postleitzahl" required>
      <input type="text" name="city" placeholder="Stadt" required>
      <input type="text" name="country" placeholder="Land" required>
      <input type="email" name="email" placeholder="Email (optional)">
    </form>
    <!-- Immer aktiv -->
    <button id="finishPayment">Zahlung abgeschlossen</button>
  </div>

</div>

<script>
// --- Warenkorb laden ---
const params = new URLSearchParams(window.location.search);
const ordersParam = params.get("orders");
let cart = [];
if (ordersParam) {
  try { cart = JSON.parse(decodeURIComponent(ordersParam)); } 
  catch(e){ console.error("Fehler beim Parsen des Warenkorbs", e); }
} else {
  cart = JSON.parse(localStorage.getItem('cart') || '[]');
}

// DOM Elemente
const summaryBox = document.getElementById("summaryBox");
const totalPriceDiv = document.getElementById("totalPrice");
const walletDiv = document.getElementById("walletAddress");
const qrImg = document.getElementById("qrCode");
const finishBtn = document.getElementById("finishPayment");

let orderId = null;

// --- Warenkorb rendern ---
function renderCart() {
  summaryBox.innerHTML = '';
  let totalPrice = 0;
  if(cart.length === 0){
    summaryBox.innerHTML = 'Dein Warenkorb ist leer';
    totalPriceDiv.textContent = '';
    return 0;
  }

  cart.forEach(item => {
    let price = typeof item.price === 'string' ? parseFloat(item.price.match(/\d+(\.\d+)?/)[0]) : Number(item.price) || 0;
    const quantity = Number(item.quantity) || 1;
    const itemTotal = price * quantity;
    totalPrice += itemTotal;

    const div = document.createElement('div');
    div.innerHTML = `
      Produkt: <strong>${item.name}</strong><br>
      Menge: <strong>${quantity}</strong><br>
      Einzelpreis: <strong>${price.toFixed(2)} USDC</strong><br>
      Gesamtpreis: <strong>${itemTotal.toFixed(2)} USDC</strong>
      <hr style="margin:8px 0; border:0; border-top:1px solid #eee;">
    `;
    summaryBox.appendChild(div);
  });

  totalPriceDiv.textContent = `Gesamtbetrag: ${totalPrice.toFixed(2)} USDC`;
  return totalPrice;
}

// --- QR-Code und Wallet vom Server abrufen ---
async function createOrder(totalPrice) {
  try {
    const res = await fetch('http://localhost:3000/api/order/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount: totalPrice })
    });
    const data = await res.json();
    orderId = data.orderId;

    // Wallet-Adresse
    walletDiv.textContent = data.publicKey || "Fehler beim Laden";

    // QR-Code nur Wallet
    qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${data.publicKey}`;

  } catch(err){
    console.error("Fehler beim Erstellen der Bestellung:", err);
    walletDiv.textContent = "Fehler beim Laden";
  }
}

// --- Wallet kopieren bei Klick ---
walletDiv.addEventListener("click", () => {
  navigator.clipboard.writeText(walletDiv.textContent).then(() => {
    alert("Wallet-Adresse kopiert!");
  });
});

// --- Initialisierung ---
const totalPrice = renderCart();
createOrder(totalPrice);

// --- Button bleibt immer aktiv ---
finishBtn.disabled = false;

// --- Bestellung abschließen ---
finishBtn.addEventListener("click", async () => {
  const formData = new FormData(document.getElementById("contactForm"));
  const shipping = Object.fromEntries(formData.entries());

  const order = {
    timestamp: Math.floor(Date.now() / 1000),
    reference: orderId,
    cart: cart,
    shipping,
    currency: "usdc"
  };

  try {
    const response = await fetch("panel_9xA3kQ/process.php", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(order)
    });
    if(response.ok){
      alert("Zahlung abgeschlossen!");
      localStorage.removeItem('cart');
      localStorage.removeItem('shipping');
      localStorage.removeItem('currency');
      const ordersParam = encodeURIComponent(JSON.stringify(cart));
      window.location.href = `thankyou.html?orders=${ordersParam}`;
    } else {
      alert("Fehler beim Übermitteln der Bestellung.");
    }
  } catch(err){
    console.error(err);
    alert("Netzwerkfehler beim Übermitteln der Bestellung.");
  }
});

document.getElementById("contactForm").addEventListener("submit", e => e.preventDefault());
</script>

</body>
</html>
