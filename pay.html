<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Payment</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Montserrat',sans-serif;
  background:#fff;
  color:#111;
}

/* HEADER */
header{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px 0;
  font-size:1rem;
  font-weight:500;
  letter-spacing:0.3em;
}

.back-link{
  position:absolute;
  left:18px;
  font-size:11px;
  letter-spacing:0.15em;
  text-decoration:none;
  color:#111;
  opacity:0.6;
}

.back-link:hover{
  opacity:1;
}

/* CONTAINER */
.payment-container{
  max-width:520px;
  margin:60px auto 120px auto;
  padding:0 24px;
}

.payment-title{
  text-align:center;
  font-size:16px;
  letter-spacing:0.35em;
  margin-bottom:40px;
}

/* SUMMARY */
.summary{
  border-top:1px solid rgba(0,0,0,0.1);
  border-bottom:1px solid rgba(0,0,0,0.1);
  padding:20px 0;
  font-size:14px;
  line-height:1.8;
  margin-bottom:20px;
}

.total{
  text-align:center;
  font-weight:600;
  letter-spacing:0.2em;
  margin-bottom:40px;
}

/* WALLET */
.wallet{
  text-align:center;
  font-size:12px;
  letter-spacing:0.08em;
  word-break:break-all;
  margin-bottom:20px;
  cursor:pointer;
  opacity:0.8;
}

.wallet:hover{
  opacity:1;
}

/* QR */
.qr{
  display:flex;
  justify-content:center;
  margin-bottom:30px;
}

/* HINT */
.hint{
  text-align:center;
  font-size:12px;
  letter-spacing:0.08em;
  margin-bottom:30px;
}

/* BUTTON */
button{
  width:100%;
  padding:18px;
  border:none;
  background:#000;
  color:#fff;
  letter-spacing:0.25em;
  font-size:13px;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  background:#111;
}
</style>
</head>

<body>

<header>
  <a href="checkout.html" class="back-link">← ZURÜCK</a>
  <span>DOMPOMSTORE</span>
</header>

<div class="payment-container">

  <div class="payment-title">PAYMENT</div>

  <div class="summary" id="summary"></div>
  <div class="total" id="total"></div>

  <div class="wallet" id="wallet"></div>

  <div class="qr">
    <img id="qr" width="180" height="180">
  </div>

<div style="margin-top:10px;font-size:12px;opacity:.6" id="orderIdDisplay"></div>
  
<div class="hint">
    Bitte sende den exakten Betrag in USDC (Solana)<br>
    Danach „warten wird überprüft“ klicken
  </div>

  

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart") || "[]");
let shipping = JSON.parse(localStorage.getItem("shipping") || "{}");

const summary = document.getElementById("summary");
const totalDiv = document.getElementById("total");
const walletDiv = document.getElementById("wallet");
const qrImg = document.getElementById("qr");

function parsePrice(value) {
  if (typeof value === "number") return value;
  if (typeof value === "string") {
    const match = value.replace(",", ".").match(/\d+(\.\d+)?/);
    return match ? parseFloat(match[0]) : 0;
  }
  return 0;
}

let total = 0;
summary.innerHTML = "";

if (cart.length === 0) {
  summary.innerHTML = "Dein Warenkorb ist leer.";
} else {
  cart.forEach(item => {
    const price = parsePrice(item.price);
    const qty = Number(item.quantity) || 1;
    const sum = price * qty;
    total += sum;

    summary.innerHTML += `
      ${item.name} × ${qty}<br>
      <strong>${sum.toFixed(2)} USDC</strong>
      <hr style="border:none;border-top:1px solid #eee;margin:8px 0">
    `;
  });
}

const order = JSON.parse(localStorage.getItem("currentOrder"));

if(!order){
  alert("Keine Bestellung gefunden");
  window.location.href = "checkout.html";
}

// Wallet vom Server
walletDiv.textContent = order.wallet;

// QR Code vom Server
qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${order.wallet}`;

// Gesamtbetrag vom Server (wichtig!)
totalDiv.textContent = `Gesamtbetrag: ${order.amount} USDC`;

walletDiv.onclick = () => {
  navigator.clipboard.writeText(order.wallet);
  alert("Wallet-Adresse kopiert");
};

/* ========================= */
/* AUTOMATISCHE PRÜFUNG */
/* ========================= */

const orderId = order.orderId;
document.getElementById("orderIdDisplay").textContent =
  "Order ID: " + orderId;

async function checkPayment() {
  try {
    const res = await fetch(`http://localhost:3000/api/check-payment/${orderId}`);
    const data = await res.json();

   if (data.status === "paid") {

  // Bestellung für Thankyou speichern
  localStorage.setItem("lastOrderCart", localStorage.getItem("cart"));

  // Jetzt Warenkorb & Daten löschen
  localStorage.removeItem("cart");
  localStorage.removeItem("shipping");
  localStorage.removeItem("currentOrder");

  window.location.href = "thankyou.html";
}
  } catch (err) {
    console.log("Status check error");
  }
}

// Alle 10 Sekunden prüfen
setInterval(checkPayment, 10000);

</script>

</body>
</html>
