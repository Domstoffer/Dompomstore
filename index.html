<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dompomstore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syncopate:wght@300;400;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --border: rgba(0, 0, 0, 0.1);
      --accent: #f4f4f4;
      --glass: rgba(255, 255, 255, 0.8);
      --input-border: rgba(0, 0, 0, 0.2);
    }

    body.dark-mode {
      --bg: #000000;
      --text: #ffffff;
      --border: rgba(255, 255, 255, 0.15);
      --accent: #111111;
      --glass: rgba(0, 0, 0, 0.8);
      --input-border: rgba(255, 255, 255, 0.2);
    }

    @keyframes slideRight {
      from {
        opacity: 0;
        transform: translateX(-40px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes reveal {
      from {
        clip-path: inset(0 100% 0 0);
      }

      to {
        clip-path: inset(0 0 0 0);
      }
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* VANGUARD SPLIT SCREEN LAYOUT */
    .vanguard-layout {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .vanguard-left {
      background: var(--bg);
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      border-right: 1px solid var(--border);
      z-index: 10;
    }

    .vanguard-left::after {
      content: 'DOMPOM';
      position: absolute;
      top: -5%;
      left: -20%;
      font-family: 'Syncopate', sans-serif;
      font-size: 28vw;
      font-weight: 700;
      color: var(--text);
      opacity: 0.02;
      pointer-events: none;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      z-index: 0;
    }

    .vanguard-right {
      padding: 60px 30px;
      display: flex;
      flex-direction: column;
      animation: slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      background: var(--bg);
      position: relative;
      z-index: 1;
    }

    @media(min-width: 900px) {
      .vanguard-layout {
        flex-direction: row;
      }

      .vanguard-left {
        width: 30vw;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        padding: 60px 40px;
      }

      .vanguard-right {
        width: 70vw;
        margin-left: 30vw;
        min-height: 100vh;
        padding: 80px 5%;
      }
    }

    /* BRANDING & NAV */
    .brand-logo {
      font-family: 'Syncopate', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
      z-index: 10;
      position: relative;
      line-height: 1.2;
    }

    .brand-logo a {
      color: inherit;
      text-decoration: none;
    }

    .brand-logo a.p-link {
      opacity: 0.3;
      transition: opacity 0.3s;
    }

    .brand-logo a.p-link:hover {
      opacity: 1;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 10;
      position: relative;
      margin-top: 50px;
    }

    .nav-item {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0.6;
      transition: opacity 0.3s, transform 0.3s;
    }

    .nav-item:hover {
      opacity: 1;
      transform: translateX(5px);
    }

    .huge-title {
      font-family: 'Syncopate', sans-serif;
      font-weight: 300;
      font-size: 3rem;
      line-height: 1.1;
      text-transform: uppercase;
      margin-bottom: 60px;
      letter-spacing: 0.05em;
      animation: reveal 1.5s cubic-bezier(0.77, 0, 0.175, 1) forwards;
    }

    .huge-title i {
      font-style: italic;
      font-weight: 400;
      color: gray;
    }

    /* PRODUCT GRID */
    .container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      width: 100%;
    }

    @media(min-width: 1200px) {
      .container {
        grid-template-columns: repeat(3, 1fr);
        gap: 40px;
      }
    }

    .container.mode-3 {
      grid-template-columns: repeat(2, 1fr);
      gap: 60px;
    }

    .product-box {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .product-box:hover {
      transform: translateY(-5px);
    }

    .image-wrapper {
      width: 100%;
      aspect-ratio: 3/4;
      overflow: hidden;
      margin-bottom: 20px;
      background: var(--accent);
    }

    .product-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1), filter 1s;
      filter: grayscale(20%);
    }

    .product-box:hover img {
      transform: scale(1.05);
      filter: grayscale(0%);
    }

    .product-info-grid {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
    }

    .product-name {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .product-price {
      font-size: 11px;
      color: gray;
      letter-spacing: 0.1em;
    }

    /* CART DRAWER */
    #cart-dropdown {
      position: fixed;
      top: 0;
      right: -100%;
      width: 400px;
      height: 100vh;
      background: var(--bg);
      border-left: 1px solid var(--border);
      padding: 60px 40px;
      transition: right 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      display: flex;
      flex-direction: column;
    }

    #cart-dropdown.show {
      right: 0;
    }

    .cart-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--glass);
      backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s;
      z-index: 999;
    }

    .cart-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .cart-title {
      font-family: 'Syncopate', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 40px;
      font-weight: 300;
    }

    #cart-items {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 30px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding: 20px 0;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .remove-item {
      cursor: pointer;
      color: gray;
      transition: color 0.3s;
    }

    .remove-item:hover {
      color: red;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-weight: 500;
      margin-bottom: 30px;
      font-size: 13px;
      letter-spacing: 0.1em;
    }

    .checkout-btn {
      width: 100%;
      padding: 24px;
      background: var(--text);
      color: var(--bg);
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.4s;
    }

    .checkout-btn:hover {
      transform: translateY(-3px);
    }

    /* LOCK SCREEN */
    #lockScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s;
    }

    .lock-title {
      font-family: 'Syncopate', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.3em;
      margin-bottom: 40px;
      opacity: 0.5;
    }

    .lock-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 14px;
      padding: 15px;
      width: 300px;
      text-align: center;
      letter-spacing: 0.4em;
      outline: none;
      transition: border-color 0.4s;
    }

    .lock-input:focus {
      border-color: #fff;
    }

    .lock-error {
      margin-top: 20px;
      font-size: 10px;
      color: red;
      letter-spacing: 0.1em;
      opacity: 0;
      transition: opacity 0.3s;
    }

    /* LAYOUT TOGGLE ANIMATION */
    .container {
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* --- MOBILE UX PREMIUM FIXES --- */
    /* CART RESPONSIVE FIX */


    /* INPUT IOS FIX (Prevent Auto-Zoom) */
    input,
    select,
    textarea {
      font-size: 16px !important;
    }

    @media (max-width: 500px) {

      /* PRODUCT CAROUSEL FIX */
      .container {
        display: flex !important;
        flex-direction: row !important;
        overflow-x: auto !important;
        scroll-snap-type: x mandatory !important;
        gap: 15px !important;
        padding-bottom: 20px !important;
        /* scrollbar padding */
        -webkit-overflow-scrolling: touch;
      }

      .container::-webkit-scrollbar {
        display: none;
        /* Hide scrollbar for clean UI */
      }

      .product-box {
        min-width: 90% !important;
        scroll-snap-align: center !important;
        flex: 0 0 auto !important;
      }

      /* STICKY CTA Product Pages */
      .add-to-cart {
        position: fixed !important;
        bottom: 0 !important;
        left: 0 !important;
        width: 100% !important;
        margin-bottom: 0 !important;
        padding-bottom: calc(26px + env(safe-area-inset-bottom)) !important;
        z-index: 1000 !important;
      }

      /* Ensure info-side doesn't overlap the fixed CTA */
      .info-side {
        padding-bottom: 120px !important;
      }
    }


    /* --- LUXURY MOBILE REDESIGN --- */

    /* BOTTOM SHEET CART */


    /* LUXURY TYPOGRAPHY */
    body {
      font-family: 'Inter', sans-serif !important;
    }

    h1,
    h2,
    h3,
    .brand-logo,
    .huge-title,
    .cart-title,
    .step-indicator {
      font-family: 'Syncopate', sans-serif !important;
    }

    @media (max-width: 768px) {

      /* FULLSCREEN HERO (Index only) */
      .mobile-hero {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        height: 100vh;
        width: 100vw;
        position: relative;
        left: 50%;
        transform: translateX(-50%);
        background: var(--bg);
        z-index: 5;
        border-bottom: 1px solid var(--border);
        margin-bottom: 40px;
      }

      .mobile-hero-title {
        font-family: 'Syncopate', sans-serif;
        font-size: 2.5rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }

      .mobile-hero-subtitle {
        font-family: 'Inter', sans-serif;
        font-size: 11px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        opacity: 0.5;
        margin-bottom: 40px;
      }

      .mobile-hero-btn {
        padding: 18px 40px;
        background: var(--text);
        color: var(--bg);
        font-size: 10px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        text-decoration: none;
        border-radius: 50px;
      }

      /* LUXURY PRODUCT CARDS */
      .product-box {
        background: var(--accent) !important;
        border-radius: 16px !important;
        overflow: hidden !important;
        padding-bottom: 20px !important;
      }

      .image-wrapper {
        border-radius: 16px 16px 0 0 !important;
        margin-bottom: 15px !important;
      }

      .product-info-grid {
        padding: 0 20px !important;
        align-items: center !important;
        text-align: center !important;
      }

      .product-name {
        font-size: 14px !important;
        font-weight: 600 !important;
      }

      .product-price {
        font-size: 13px !important;
        font-weight: 400 !important;
        color: var(--text) !important;
        opacity: 0.7 !important;
        margin-top: 5px !important;
      }
    }

    /* PREVENT DOUBLE TAP ZOOM */
    html,
    body {
      touch-action: manipulation !important;
    }
  
    .grid-three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .grid-two { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .grid-one { display: grid; grid-template-columns: 1fr; gap: 20px; }
    
    @media(max-width: 900px) {
        /* Mobile overrides usually force everything to 1 or 2 columns, but we'll let the user toggle if they want or let css rule */
        .grid-three { grid-template-columns: repeat(2, 1fr); }
    }
    @media(max-width: 600px) {
        .grid-three { grid-template-columns: 1fr; }
        .grid-two { grid-template-columns: 1fr; }
    }

</style>

    /* iOS Safe Area Support */

    /* Premium Touch Interactions */

    /* Safari Input Reset */

<body class="">

  <div id="lockScreen"
    style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; color: #000; font-family: 'Syncopate', sans-serif;">
    <h1 style="letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 30px;">ACCESS</h1>
    <input type="password" id="passwordInput" placeholder="Enter password"
      style="padding: 15px; border: 1px solid #ddd; outline: none; text-align: center; font-family: 'Inter', sans-serif; letter-spacing: 0.1em; width: 300px; max-width: 80%; background: transparent; color: #000; font-size: 14px; border-radius: 0; margin-bottom: 20px;">
    <button onclick="unlockSite()"
      style="padding: 15px 40px; background: #000; color: #fff; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 0.15em; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; transition: 0.3s; width: 300px; max-width: 80%;">Enter</button>
    <p id="errorMsg"
      style="color: red; margin-top: 20px; font-family: 'Inter', sans-serif; font-size: 12px; height: 15px;"></p>
  </div>



  <div id="shopContent" style="display:none;">
    <div class="vanguard-layout">
      <!-- FIXED LEFT MENU -->
      <div class="vanguard-left">
        <div>
          <button id="gridToggle" class="grid-toggle-btn">+</button>
          <div class="brand-logo"><a href="index.html">DOM</a><a href="hidden.html" class="secret-link"
              style="cursor:pointer; opacity:0.3; transition:0.3s;" onmouseover="this.style.opacity=1"
              onmouseout="this.style.opacity=0.3">P</a><a href="index.html">OMSTORE</a></div>
          <div class="nav-menu">
            <div class="cart-icon" id="cart-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"

                <path d="M6 2l1 5h10l1-5z" />

              </svg>

              <span class="cart-count" id="cart-count">0</span>
            </div>

          </div>

        <div style="font-size:10px; letter-spacing:0.1em; opacity:0.3; text-transform:uppercase;">
          © 2026 Dompomstore.<br>All rights reserved.
        </div>
      </div>

      <!-- SCROLLABLE RIGHT CONTENT -->
      <div class="vanguard-right">
        <h1 class="huge-title">New <i>Arrivals</i></h1>
        <div class="container grid-three" id="productsGrid">
        </div>
      </div>

      <!-- CART DRAWER -->
      <div class="cart-overlay" id="cart-overlay"></div>
      <div id="cart-dropdown">
        <h2 class="cart-title">Cart</h2>
        <div id="cart-items"></div>
        <div class="cart-total">
          <span>Total</span>
          <span id="cart-total-price">0 USD</span>
        </div>
        <button class="checkout-btn" id="proceedCheckout">Proceed to Checkout</button>
      </div>
    </div>

    <script>

    </script>
    <!-- ANTI-ZOOM SCRIPT -->
    <script>
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (event) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, false);
    </script>


    <script src="cart.js"></script>

    <script>
      function unlockSite() {
        const password = "dompom";
        const input = document.getElementById("passwordInput").value;

        if (input === password) {
          document.getElementById("lockScreen").style.display = "none";
          document.getElementById("shopContent").style.display = "block";

          const script = document.createElement("script");
          script.src = "products.js";
          document.body.appendChild(script);

        } else {
          document.getElementById("errorMsg").innerText = "Wrong password";
        }
      }

      document.getElementById("passwordInput").addEventListener("keypress", function (event) {
        if (event.key === "Enter") {
          event.preventDefault();
          unlockSite();
        }
      });
    </script>


<script>
    const toggle = document.getElementById("gridToggle");
    const grid = document.getElementById("productsGrid");
    
    if(toggle && grid) {
        // Initialize to grid-three by default if we want to start at 3er
        // The user asked "kannst du bilder in 3er reihe machen" meaning start at 3?
        // Wait, current HTML is "container grid-two". We'll change the HTML below.
        
        toggle.onclick = function() {
            if(grid.classList.contains("grid-three")) {
                grid.classList.remove("grid-three");
                grid.classList.add("grid-two");
                toggle.innerText = "++";
            } else if(grid.classList.contains("grid-two")) {
                grid.classList.remove("grid-two");
                grid.classList.add("grid-one");
                toggle.innerText = "+++";
            } else {
                grid.classList.remove("grid-one");
                grid.classList.add("grid-three");
                toggle.innerText = "+";
            }
        };
    }
</script>
