<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shop Index</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Montserrat', sans-serif; background:#ffffff; color:#111; }

/* HEADER */
header{
  position:relative;
  padding:20px;
}

.cart-icon{
  position:absolute;
  right:20px;
  top:20px;
  cursor:pointer;
}

.cart-icon svg{
  width:26px;
  height:26px;
  stroke:#000;
  fill:none;
  stroke-width:2;
}

.cart-count{
  position:absolute;
  right:-4px;
  top:-6px;
  background:none;
  color:#000;
  font-size:12px;
  font-weight:600;
}



/* CART DRAWER */
#cart-dropdown{
  position:fixed;
  top:0;
  right:-100%;
  width:320px;
  height:100%;
  background:#fff;
  padding:30px 20px;
  box-shadow:-10px 0 30px rgba(0,0,0,0.1);
  transition:.4s ease;
  text-align:left;
  z-index:1000;
}

#cart-dropdown.show{
  right:0;
}
.cart-title{
  font-size:18px;
  margin-bottom:20px;
}

#cart-items{
  margin-bottom:20px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
  font-size:14px;
}

.cart-left{
  display:flex;
  gap:10px;
}

.remove-item{
  cursor:pointer;
  font-weight:bold;
}

.cart-footer{
  position:absolute;
  bottom:30px;
  left:20px;
  right:20px;
}

.cart-total{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
  font-weight:600;
}

.checkout-btn{
  width:100%;
  padding:12px;
  background:#000;
  color:#fff;
  border:none;
  cursor:pointer;
}

.cart-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.2);
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

.cart-overlay.show{
  opacity:1;
  pointer-events:all;
}

/* PRODUKT GRID */
.container{
  max-width:1200px;
  margin:90px auto 120px auto;
  padding:0 30px;

  display:grid;
  grid-template-columns: repeat(3, 1fr);
  column-gap:40px;
  row-gap:70px;
}

.product-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  padding:0;
}

.product-box:hover{
  transform:none;
  box-shadow:none;
}

.product-box img{
  width:100%;
  max-width:240px;
  height:auto;
  object-fit:contain;
}

.product-box img:hover{
  transform:none;
  opacity:1;
}

.product-name{
  font-size:16px;
  letter-spacing:3px;
  margin-top:18px;
}
@media (max-width:768px){

  .container{
    grid-template-columns: repeat(2, 1fr);
    column-gap:25px;
    row-gap:60px;
    padding:0 20px;
  }

  header{
    font-size:1rem;
    letter-spacing:0.3em;
  }

  .cart-icon{
    right:18px;
    top:50%;
    transform:translateY(-50%);
  }

  #cart-dropdown{
    width:100%;
    right:-100%;
    top:0;
    height:100%;
    border-radius:0;
  }

  #cart-dropdown.show{
    right:0;
  }

  .product-box img{
    max-width:160px;
  }
}

.layout-btn{
  position:absolute;
  left:20px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  width:auto;
  height:auto;
  border-radius:0;
  color:#111;
  font-size:20px;
  font-weight:400;
}
.layout-btn:hover{
  transform:translateY(-50%) scale(1.1);
}

/* Grid Modi */
.container.mode-3{
  grid-template-columns: repeat(3, 1fr);
}

.container.mode-2{
  grid-template-columns: repeat(2, 1fr);
}

.container.mode-1{
  grid-template-columns: repeat(1, 1fr);
}
</style>


</head>
<body>

<header>
  <div id="layout-toggle" class="layout-btn">+</div>
  Dompomstore
<div class="cart-icon" id="cart-icon">
  <span class="cart-count" id="cart-count" style="display:none;">0</span>

  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M6 2l1 5h10l1-5z"/>
    <path d="M2 7h20v14H2z"/>
  </svg>
</div>

<div id="cart-dropdown">

  <h2 class="cart-title">Warenkorb</h2>

  <div id="cart-items"></div>

  <div class="cart-footer">
    <div class="cart-total">
      <span>Total</span>
      <span id="cart-total-price">0 $</span>
    </div>
    <button class="checkout-btn">Checkout</button>
  </div>

</div>

<div class="cart-overlay" id="cart-overlay"></div>
</header>
<div class="container">

<div class="product-box" data-price="49">
  <img src="images/DB-01.jpg" alt="DB-01" data-link="produkt1.html">
  <div class="product-name">DB-01</div>
</div>

  <div class="product-box" data-price="19">
    <img src="https://picsum.photos/seed/p02/400/400" alt="PRODUKT 02" data-link="produkt2.html">
    <div class="product-name">PRODUKT 02</div>
  </div>

  <div class="product-box" data-price="30">
    <img src="https://picsum.photos/seed/p03/400/400" alt="PRODUKT 03" data-link="produkt3.html">
    <div class="product-name">PRODUKT 03</div>
  </div>

  <div class="product-box" data-price="22">
    <img src="images/zyn.png" alt="PRODUKT 04" data-link="produkt4.html">
    <div class="product-name">PRODUKT 04</div>
  </div>

  <div class="product-box" data-price="18">
    <img src="https://picsum.photos/seed/p05/400/400" alt="PRODUKT 05" data-link="produkt5.html">
    <div class="product-name">PRODUKT 05</div>
  </div>
</div>

<script>
let cart=[];
const cartCount=document.getElementById("cart-count");
const cartDrawer = document.getElementById("cart-dropdown");
const overlay = document.getElementById("cart-overlay");
const checkoutBtn = document.querySelector(".checkout-btn");

function loadCart(){
  const stored=localStorage.getItem("cart");
  cart=stored?JSON.parse(stored):[];
  updateCart(false);
}

function updateCart(save=true){

  const cartItems = document.getElementById("cart-items");
  const totalPriceEl = document.getElementById("cart-total-price");

  cartItems.innerHTML = "";
  let total = 0;

  if(cart.length === 0){
    cartItems.innerHTML = "<p style='font-size:14px;'>Warenkorb leer</p>";
  } else {

    cart.forEach((item,index)=>{

      total += item.price;

      const div = document.createElement("div");
      div.classList.add("cart-item");

      div.innerHTML = `
        <div class="cart-left">
          <span>${item.name}</span>
          <span>(${item.size || ""})</span>
        </div>
        <div>
          <span>${item.price} $</span>
          <span class="remove-item" onclick="removeItem(${index})">×</span>
        </div>
      `;

      cartItems.appendChild(div);
    });
  }

  totalPriceEl.innerText = total + " $";
  cartCount.style.display = cart.length > 0 ? "flex" : "none";
  cartCount.innerText = cart.length;

  if(save){
    localStorage.setItem("cart", JSON.stringify(cart));
  }
}

function removeItem(index){
  cart.splice(index,1);
  updateCart();
}

document.getElementById("cart-icon").onclick = () => {
  cartDrawer.classList.toggle("show");
  overlay.classList.toggle("show");
};

overlay.onclick = () => {
  cartDrawer.classList.remove("show");
  overlay.classList.remove("show");
};

window.addEventListener("pageshow", function () {
  loadCart();
});

loadCart();  // 

document.querySelectorAll('.product-box img').forEach(img=>{
  img.addEventListener('click', ()=>{
    window.location.href = img.dataset.link;
  });
});

if(checkoutBtn){
  checkoutBtn.addEventListener('click', ()=>{
    loadCart();

    if(cart.length === 0){
      alert('Dein Warenkorb ist leer!');
      return;
    }

    window.location.href = 'checkout.html';
  });
}
const container = document.querySelector('.container');
const layoutBtn = document.getElementById('layout-toggle');

let layoutMode = localStorage.getItem('layoutMode') || "mode-3";

applyLayout(layoutMode);

layoutBtn.addEventListener('click', ()=>{
  if(layoutMode === "mode-3"){
    layoutMode = "mode-2";
  } else if(layoutMode === "mode-2"){
    layoutMode = "mode-1";
  } else {
    layoutMode = "mode-3";
  }

  localStorage.setItem('layoutMode', layoutMode);
  applyLayout(layoutMode);
});

function applyLayout(mode){
  container.classList.remove("mode-3","mode-2","mode-1");
  container.classList.add(mode);
}
</script>

</body>
</html>
