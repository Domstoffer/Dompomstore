<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dompomstore</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Montserrat', sans-serif; background: #fff; color: #000; }

/* HEADER */
header {
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  font-weight: 500;
  letter-spacing: 0.14em;
  position: sticky;
  top: 0;
  background: #fff;
  z-index: 100;
}

/* PLUS BUTTON */
.grid-toggle {
  position: absolute;
  left: 14px;
  font-size: 22px;
  cursor: pointer;
  user-select: none;
}

/* CART ICON */
.cart-icon {
  position: absolute;
  right: 14px;
  cursor: pointer;
  z-index: 250; /* immer klickbar */
}

.cart-icon svg {
  width: 22px;
  height: 22px;
  stroke: #000;
  fill: none;
  stroke-width: 2;
}

/* PRODUKT GRID */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 18px 14px 80px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  column-gap: 16px;
  row-gap: 36px;
}

.container.two-cols { grid-template-columns: repeat(2, 1fr); }

.product-box { text-align: center; }

.product-box img { width: 100%; display: block; cursor: pointer; }
.product-name { margin-top: 8px; font-size: 0.7rem; letter-spacing: 0.18em; font-weight: 500; }

/* WARENKORB SLIDE-IN */
.cart-panel {
  position: fixed;
  top: 0;
  right: -85%; /* weiter nach links auf Handy */
  width: 75%;
  max-width: 300px;
  height: 100%;
  background: #fff;
  box-shadow: -10px 0 30px rgba(0,0,0,0.15);
  padding: 15px;
  transition: right 0.3s ease;
  z-index: 200;
}

@media (min-width: 768px) {
  .cart-panel { width: 400px; max-width: none; right: -100%; }
}

/* Mobile: beim Öffnen etwas weiter nach links */
@media (max-width: 767px) {
  .cart-panel.open {
    right: 10px;
  }
}

/* Desktop */
.cart-panel.open { right: 0; }

.cart-panel h3 { font-size: 0.9rem; letter-spacing: 0.12em; margin-bottom: 20px; }

#cartItems { font-size: 0.8rem; }

.cart-item { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; }
.cart-item button { background: none; border: none; color: red; font-size: 0.8rem; cursor: pointer; }

/* OVERLAY */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  z-index: 150;
}
.overlay.show { opacity: 1; pointer-events: auto; }
</style>
</head>

<body>

<header>
  <span class="grid-toggle" id="gridToggle">＋</span>
  DOMPOMSTORE
  <span class="cart-icon" id="cartBtn">
    <svg xmlns="http://www.w3.org/2000/svg">
      <path d="M6 2l1 5h10l1-5z"/>
      <path d="M2 7h20v14H2z"/>
    </svg>
  </span>
</header>

<div class="container" id="productGrid"></div>

<!-- WARENKORB -->
<div class="cart-panel" id="cartPanel">
  <h3>WARENKORB</h3>
  <div id="cartItems">Dein Warenkorb ist leer</div>
  <hr>
  <div id="cartTotal" style="margin-top:10px; font-weight:500;">Gesamt: €0.00</div>
</div>

<div class="overlay" id="overlay"></div>

<script>
// Produkte
const products = [
  {name: "PK-01", price: 29.99, page: "produkt1.html", img: "images/test cyp.png"},
  {name: "JC-10", price: 19.99, page: "produkt2.html", img: "https://picsum.photos/seed/a/500/500"},
  {name: "JC-11", price: 24.99, page: "produkt3.html", img: "https://picsum.photos/seed/b/500/500"},
  {name: "SL-03", price: 14.99, page: "produkt4.html", img: "https://picsum.photos/seed/c/500/500"}
];

// Grid füllen
const productGrid = document.getElementById('productGrid');
productGrid.innerHTML = products.map(p => `
  <div class="product-box">
    <img src="${p.img}" onclick="location.href='${p.page}'">
    <div class="product-name">${p.name}</div>
  </div>
`).join("");

// Warenkorb
let cart = JSON.parse(localStorage.getItem('cart')) || [];

function saveCart() { localStorage.setItem('cart', JSON.stringify(cart)); }

function renderCart() {
  const cartDiv = document.getElementById('cartItems');
  const totalDiv = document.getElementById('cartTotal');

  if (cart.length === 0) {
    cartDiv.innerHTML = "Dein Warenkorb ist leer";
    totalDiv.textContent = "Gesamt: €0.00";
  } else {
    cartDiv.innerHTML = cart.map((item, i) => `
      <div class="cart-item">
        <span>${item.name} (€${item.price.toFixed(2)})</span>
        <button onclick="removeFromCart(${i})">✕</button>
      </div>
    `).join("");
    const total = cart.reduce((sum, item) => sum + item.price, 0);
    totalDiv.textContent = `Gesamt: €${total.toFixed(2)}`;
  }
}

function removeFromCart(index) {
  cart.splice(index, 1);
  saveCart();
  renderCart();
}

// Grid Toggle
const toggleBtn = document.getElementById('gridToggle');
let gridState = 0;

toggleBtn.addEventListener('click', () => {
  if (window.innerWidth <= 767) {
    gridState = (gridState + 1) % 3;
    productGrid.style.gridTemplateColumns =
      gridState === 0 ? "repeat(3, 1fr)" :
      gridState === 1 ? "repeat(2, 1fr)" :
                        "repeat(1, 1fr)";
  } else { productGrid.classList.toggle('two-cols'); }
});

// Warenkorb öffnen / schließen
const cartBtn = document.getElementById('cartBtn');
const cartPanel = document.getElementById('cartPanel');
const overlay = document.getElementById('overlay');

cartBtn.addEventListener('click', () => {
  renderCart();
  cartPanel.classList.add('open');
  overlay.classList.add('show');
});

overlay.addEventListener('click', () => {
  cartPanel.classList.remove('open');
  overlay.classList.remove('show');
});

renderCart();
</script>

</body>
</html>
