<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Index</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Montserrat', sans-serif; background:#ffffff; color:#111; }

/* HEADER */
header {
  padding:18px 0;
  text-align:center;
  font-size:1.4rem;
  font-weight:500;
  letter-spacing:0.25em;
  color:#111;
  position: relative;
}

.cart-icon{
  position:absolute;
  right:20px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
}

.cart-icon svg{
  width:22px;
  height:22px;
  stroke:#000;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.cart-icon:hover{
  transform:translateY(-50%) scale(1.1);
}

#cart-dropdown {
  display:none;
  position:absolute;
  top:70px;
  right:40px;
  width:350px;
  background:#fff;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  padding:15px;
  z-index:1000;
}
#cart-dropdown.show { display:block; }
#cart-dropdown h3 {
  font-size:1.2rem;
  margin-bottom:10px;
  border-bottom:1px solid #ddd;
  padding-bottom:6px;
}
#cart-items {
  list-style:none;
  max-height:220px;
  overflow-y:auto;
  margin-bottom:12px;
  padding-left:0;
}
#cart-items li {
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:0.95rem;
  padding:8px 0;
  border-bottom:1px solid #eee;
}
#cart-items li:last-child { border-bottom:none; }
#cart-items button {
  background:none;
  border:none;
  color:red;
  cursor:pointer;
  font-size:1.1rem;
}

#checkout-btn {
  width:100%;
  padding:12px;
  background:#00c271;
  color:#fff;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}
#checkout-btn:hover { background:#009957; }

/* PRODUKT GRID */
.container {
  max-width:1000px;
  margin:100px auto;
  padding:0 40px;
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:120px 60px;
}

.product-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  overflow:hidden;
  border-radius:16px; /* HIER NEU */
  transition: transform .35s cubic-bezier(.4,0,.2,1);
}

.product-box:hover{
  transform: translateY(-6px);
  box-shadow: 0 12px 28px rgba(0,0,0,0.06);
}

.product-box img{
  width:70%;
  max-height:220px;
  height:auto;
  object-fit:contain;
  cursor:pointer;
  transition: transform .35s cubic-bezier(.4,0,.2,1),
            opacity .25s ease;
}

.product-box img:hover{
  opacity:0.9;
  transform: scale(1.05);
}

.product-name{
  font-size:0.85rem;
  font-weight:400;
  letter-spacing:0.25em;
  margin-top:25px;
}
@media (max-width:768px){
  .container{
    grid-template-columns: repeat(2, 1fr);
    gap:80px 20px;
    padding:0 20px;
  }

  header{
    font-size:1rem;
    letter-spacing:0.3em;
  }

  .cart-icon{
    right:18px;
    top:50%;
    transform:translateY(-50%);
  }

  #cart-dropdown{
    right:4%;
    width:92%;
    top:70px;
    border-radius:18px;
  }

  .product-box img{
    max-height:160px;
  }
}

.cart-badge{
  position:absolute;
  top:-6px;
  right:-8px;
  background:#ff3b30;
  color:#fff;
  font-size:11px;
  font-weight:600;
  border-radius:50%;
  width:18px;
  height:18px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.layout-btn{
  position:absolute;
  left:20px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  width:auto;
  height:auto;
  border-radius:0;
  color:#111;
  font-size:20px;
  font-weight:400;
}
.layout-btn:hover{
  transform:translateY(-50%) scale(1.1);
}

/* Grid Modi */
.container.mode-3{
  grid-template-columns: repeat(3, 1fr);
}

.container.mode-2{
  grid-template-columns: repeat(2, 1fr);
}

.container.mode-1{
  grid-template-columns: repeat(1, 1fr);
}
</style>


</head>
<body>

<header>
  <div id="layout-toggle" class="layout-btn">+</div>
  Dompomstore
 <span class="cart-icon" id="cart-icon">
  <div id="cart-count" class="cart-badge" style="display:none;">0</div>
  <svg xmlns="http://www.w3.org/2000/svg">
    <path d="M6 2l1 5h10l1-5z"/>
    <path d="M2 7h20v14H2z"/>
    <path d="M16 11a4 4 0 0 1-8 0"/>
  </svg>
</span>

  <div id="cart-dropdown">
    <h3>Warenkorb</h3>
    <ul id="cart-items"><li>Der Warenkorb ist leer</li></ul>
    <button id="checkout-btn">Checkout</button>
  </div>
</header>

<div class="container">
  <div class="product-box" data-price="25">
    <img src="images/test cyp.png" alt="TEST CYP" data-link="produkt1.html">
    <div class="product-name">TEST CYP</div>
  </div>

  <div class="product-box" data-price="19">
    <img src="https://picsum.photos/seed/p02/400/400" alt="PRODUKT 02" data-link="produkt2.html">
    <div class="product-name">PRODUKT 02</div>
  </div>

  <div class="product-box" data-price="30">
    <img src="https://picsum.photos/seed/p03/400/400" alt="PRODUKT 03" data-link="produkt3.html">
    <div class="product-name">PRODUKT 03</div>
  </div>

  <div class="product-box" data-price="22">
    <img src="images/zyn.png" alt="PRODUKT 04" data-link="produkt4.html">
    <div class="product-name">PRODUKT 04</div>
  </div>

  <div class="product-box" data-price="18">
    <img src="https://picsum.photos/seed/p05/400/400" alt="PRODUKT 05" data-link="produkt5.html">
    <div class="product-name">PRODUKT 05</div>
  </div>
</div>

<script>
let cart = [];
const cartIcon = document.getElementById('cart-icon');
const cartDropdown = document.getElementById('cart-dropdown');
const cartItems = document.getElementById('cart-items');
const checkoutBtn = document.getElementById('checkout-btn');
const cartCount = document.getElementById('cart-count');

function loadCart() {
  const stored = localStorage.getItem('cart');
  cart = stored ? JSON.parse(stored) : [];
  cart.forEach(item => { if(!item.quantity) item.quantity = 1; });
  updateCartDropdown();
}

function updateCartDropdown() {
  cartItems.innerHTML = '';

  let totalItems = 0;

  if(cart.length === 0){
    cartItems.innerHTML = '<li>Der Warenkorb ist leer</li>';
    cartCount.style.display = "none";
    localStorage.setItem('cart', JSON.stringify(cart));
    return;
  }

  cart.forEach((item, index) => {
    totalItems += item.quantity;

    const li = document.createElement('li');
    li.innerHTML = `
      ${item.name} x${item.quantity}
      <button class="remove-btn" data-index="${index}">×</button>
    `;
    cartItems.appendChild(li);
  });

  cartCount.style.display = "flex";
  cartCount.textContent = totalItems;

  localStorage.setItem('cart', JSON.stringify(cart));
}

cartItems.addEventListener('click', e => {
  if(e.target.classList.contains('remove-btn')){
    loadCart();
    cart.splice(e.target.dataset.index, 1);
    updateCartDropdown();
    e.stopPropagation();
  }
});

cartIcon.addEventListener('click', e=>{
  e.stopPropagation();
  loadCart();
  cartDropdown.classList.toggle('show');
});

document.addEventListener('click', e=>{
  if(!cartDropdown.contains(e.target) && e.target!==cartIcon){
    cartDropdown.classList.remove('show');
  }
});

loadCart();

document.querySelectorAll('.product-box img').forEach(img=>{
  img.addEventListener('click', ()=>{
    window.location.href = img.dataset.link;
  });
});

checkoutBtn.addEventListener('click', ()=>{
  loadCart();
  if(cart.length === 0){
    alert('Dein Warenkorb ist leer!');
    return;
  }
  window.location.href = 'checkout.html';
});
const container = document.querySelector('.container');
const layoutBtn = document.getElementById('layout-toggle');

let layoutMode = localStorage.getItem('layoutMode') || "mode-3";

applyLayout(layoutMode);

layoutBtn.addEventListener('click', ()=>{
  if(layoutMode === "mode-3"){
    layoutMode = "mode-2";
  } else if(layoutMode === "mode-2"){
    layoutMode = "mode-1";
  } else {
    layoutMode = "mode-3";
  }

  localStorage.setItem('layoutMode', layoutMode);
  applyLayout(layoutMode);
});

function applyLayout(mode){
  container.classList.remove("mode-3","mode-2","mode-1");
  container.classList.add(mode);
}
</script>

</body>
</html>
