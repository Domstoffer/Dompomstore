<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dompomstore</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Montserrat', sans-serif;
  background: #fff;
  color: #000;
}

/* HEADER */
header {
  padding: 18px 16px;
  text-align: center;
  font-size: 0.95rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  position: relative;
}

.cart-icon {
  position: absolute;
  right: 16px;
  top: 16px;
  cursor: pointer;
}

.cart-icon svg {
  width: 22px;
  height: 22px;
  stroke: #000;
  fill: none;
  stroke-width: 2;
}

/* PRODUKT GRID */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px 14px 60px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  column-gap: 18px;
  row-gap: 42px;
}

/* PRODUKT */
.product-box {
  text-align: center;
}

.product-box img {
  width: 100%;
  height: auto;
  display: block;
  cursor: pointer;
}

.product-name {
  margin-top: 10px;
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  font-weight: 500;
}

/* RESPONSIVE */
@media (max-width: 500px) {
  .container {
    grid-template-columns: repeat(3, 1fr);
  }
}
</style>
</head>

<body>

<header>
  DOMPOMSTORE
  <span class="cart-icon">
    <svg xmlns="http://www.w3.org/2000/svg">
      <path d="M6 2l1 5h10l1-5z"/>
      <path d="M2 7h20v14H2z"/>
    </svg>
  </span>
</header>

<div class="container">

  <div class="product-box">
    <img src="images/test cyp.png" onclick="location.href='produkt1.html'">
    <div class="product-name">PK-01</div>
  </div>

  <div class="product-box">
    <img src="https://picsum.photos/seed/a/500/500" onclick="location.href='produkt2.html'">
    <div class="product-name">JC-10</div>
  </div>

  <div class="product-box">
    <img src="https://picsum.photos/seed/b/500/500" onclick="location.href='produkt3.html'">
    <div class="product-name">JC-11</div>
  </div>

  <div class="product-box">
    <img src="https://picsum.photos/seed/c/500/500">
    <div class="product-name">SL-03</div>
  </div>

  <div class="product-box">
    <img src="https://picsum.photos/seed/d/500/500">
    <div class="product-name">BL-01</div>
  </div>

  <div class="product-box">
    <img src="https://picsum.photos/seed/e/500/500">
    <div class="product-name">SG-03</div>
  </div>

</div>

</body>
</html>
