<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestellung erfolgreich – Dompomstore</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Montserrat',sans-serif;
  background:#fff;
  color:#111;
}

/* HEADER */
header{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px 0;
  font-size:1rem;
  font-weight:500;
  letter-spacing:0.3em;
}

.container{
  max-width:520px;
  margin:80px auto 120px auto;
  padding:0 24px;
  text-align:center;
}

.title{
  font-size:16px;
  letter-spacing:0.35em;
  margin-bottom:30px;
}

.check{
  font-size:40px;
  margin-bottom:20px;
}

.text{
  font-size:14px;
  line-height:1.8;
  margin-bottom:40px;
  opacity:0.8;
}

.order-box{
  border-top:1px solid rgba(0,0,0,0.1);
  border-bottom:1px solid rgba(0,0,0,0.1);
  padding:25px 0;
  margin-bottom:40px;
  text-align:left;
}

.order-item{
  display:flex;
  justify-content:space-between;
  margin-bottom:12px;
  font-size:14px;
}

.total{
  display:flex;
  justify-content:space-between;
  font-weight:600;
  margin-top:20px;
  letter-spacing:0.15em;
}

.btn{
  width:100%;
  padding:18px;
  border:none;
  background:#000;
  color:#fff;
  letter-spacing:0.25em;
  font-size:13px;
  cursor:pointer;
  transition:.3s;
  margin-bottom:14px;
}

.btn:hover{
  background:#111;
}

.btn-outline{
  background:#fff;
  color:#000;
  border:1px solid #000;
}

.btn-outline:hover{
  background:#000;
  color:#fff;
}
</style>
</head>

<body>

<header>
  <span>DOMPOMSTORE</span>
</header>

<div class="container">

  <div class="check">✓</div>

  <div class="title">BESTELLUNG ERFOLGREICH</div>

  <div class="text">
    Vielen Dank für deine Bestellung.<br>
    Deine Zahlung wurde bestätigt und deine Bestellung wird bearbeitet.
  </div>

  <div class="order-box" id="orderBox">
    <div class="order-item">
      <span>Keine Bestellung gefunden</span>
      <span></span>
    </div>
  </div>

  <a href="index.html" class="btn" onclick="clearData()">ZUR STARTSEITE</a>

<a href="https://t.me/dompomstore"
   target="_blank"
   class="btn btn-outline"
   onclick="clearData()">
   TELEGRAM SUPPORT
</a>

</div>

<script>
const orderBox = document.getElementById("orderBox");

// Statt cart → lastOrderCart verwenden
const cart = JSON.parse(localStorage.getItem("lastOrderCart") || "[]");

orderBox.innerHTML = "";

let total = 0;

if(cart.length === 0){
  orderBox.innerHTML = `
    <div class="order-item">
      <span>Keine Daten verfügbar</span>
      <span></span>
    </div>
  `;
} else {
  cart.forEach(item=>{
    const price = parseFloat(item.price) || 0;
    const qty = parseInt(item.quantity) || 1;
    const sum = price * qty;
    total += sum;

    orderBox.innerHTML += `
      <div class="order-item">
        <span>${item.name} × ${qty}</span>
        <span>${sum.toFixed(2)} USDC</span>
      </div>
    `;
  });

  orderBox.innerHTML += `
    <div class="total">
      <span>GESAMT</span>
      <span>${total.toFixed(2)} USDC</span>
    </div>
  `;
}

function clearData(){
  localStorage.removeItem("lastOrderCart");
}
</script>

</body>
</html>
