<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PK-01</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Montserrat',sans-serif;
  background:#ffffff;
  color:#111;
  text-align:center;
  animation:fadeIn .6s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

/* HEADER */
header{
  padding:20px;
  position:relative;
}

.back{
  position:absolute;
  left:20px;
  top:22px;
  text-decoration:none;
  color:#111;
  font-size:22px;
}

.cart-icon{
  position:absolute;
  right:20px;
  top:20px;
  cursor:pointer;
}

.cart-count{
  position:absolute;
  right:-8px;
  top:-8px;
  background:#000;
  color:#fff;
  font-size:12px;
  padding:3px 6px;
  border-radius:50%;
}

.cart-icon svg{
  width:26px;
  height:26px;
  stroke:#000;
  fill:none;
  stroke-width:2;
}

/* PRODUKT */
.product-container{
  padding:40px 20px;
}

.product-image{
  max-width:420px;
  margin:auto;
  overflow:hidden;
}

.image-track{
  display:flex;
  transition:transform .5s cubic-bezier(.4,.2,.2,1);
}

.image-track img{
  width:100%;
  flex-shrink:0;
  user-select:none;
  pointer-events:none;
}

.dots{
  margin:15px 0 40px 0;
}

.dots span{
  display:inline-block;
  width:6px;
  height:6px;
  background:#ccc;
  border-radius:50%;
  margin:0 4px;
  cursor:pointer;
}

.dots span.active{
  background:#000;
}

.product-title{
  font-size:22px;
  margin-bottom:20px;
}

.product-price{
  font-size:24px;
  letter-spacing:2px;
  margin-bottom:30px;
}


/* PLUS BUTTON */
.add-btn{
  font-size:40px;
  border:none;
  background:none;
  cursor:pointer;
}

.add-btn:hover{
  opacity:.6;
}
/* ADD DROPDOWN */
.add-wrapper{
  position:relative;
  display:inline-block;
}

.add-btn{
  color:#000; /* Plus jetzt schwarz */
}

.size-dropdown{
  position:absolute;
  bottom:60px;
  left:50%;
  transform:translate(-50%, 10px);
  background:#fff;
  border:1px solid #000;
  min-width:80px;
  z-index:10;

  opacity:0;
  pointer-events:none;
  transition:all .25s ease;
}

.size-dropdown.show{
  opacity:1;
  transform:translate(-50%, 0);
  pointer-events:all;
}

.size-dropdown div{
  padding:10px;
  cursor:pointer;
  border-bottom:1px solid #eee;
}

.size-dropdown div:last-child{
  border-bottom:none;
}

.size-dropdown div:hover{
  background:#000;
  color:#fff;
}

/* CART DRAWER */
#cart-dropdown{
  position:fixed;
  top:0;
  right:-100%;
  width:320px;
  height:100%;
  background:#fff;
  padding:30px 20px;
  box-shadow:-10px 0 30px rgba(0,0,0,0.1);
  transition:.4s ease;
  text-align:left;
  z-index:1000;
}

#cart-dropdown.show{
  right:0;
}

.cart-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.2);
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

.cart-overlay.show{
  opacity:1;
  pointer-events:all;
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="back">‹</a>

  <div class="cart-icon" id="cart-icon">
    <span class="cart-count" id="cart-count">0</span>
    <svg xmlns="http://www.w3.org/2000/svg">
      <path d="M6 2l1 5h10l1-5z"/>
      <path d="M2 7h20v14H2z"/>
    </svg>
  </div>

  <div id="cart-dropdown">
    <ul id="cart-items"><li>Warenkorb leer</li></ul>
    <button id="checkout-btn">Checkout</button>
  </div>
</header>

<div class="cart-overlay" id="cart-overlay"></div>

<div class="product-container">

<div class="product-image">
  <div class="image-track" id="imageTrack">
    <img src="images/DB-01.jpg">
    <img src="images/DB-00.jpg">
  </div>
</div>

  <div class="dots">
    <span class="active" onclick="setImg(0)"></span>
    <span onclick="setImg(1)"></span>
  </div>

  <div class="product-title">PK-01</div>
  <div class="product-price">100 US-DOLLAR</div>


<div class="add-wrapper">
  <button class="add-btn" id="addBtn">+</button>

  <div class="size-dropdown" id="sizeDropdown">
    <div onclick="addWithSize('S')">S</div>
    <div onclick="addWithSize('M')">M</div>
    <div onclick="addWithSize('L')">L</div>
  </div>
</div>

<script>

const imageTrack = document.getElementById("imageTrack");
let currentImg = 0;

function setImg(i){
  currentImg = i;
  imageTrack.style.transform = `translateX(-${i * 100}%)`;

  document.querySelectorAll(".dots span")
    .forEach((d,idx)=>d.classList.toggle("active",idx===i));
}


let startX = 0;

imageTrack.addEventListener("touchstart", e=>{
  startX = e.touches[0].clientX;
});

imageTrack.addEventListener("touchend", e=>{
  let diff = e.changedTouches[0].clientX - startX;

  if(diff > 50 && currentImg > 0){
    setImg(currentImg - 1);
  }

  if(diff < -50 && currentImg < 1){
    setImg(currentImg + 1);
  }
});

/* CART */
let cart=[];
const cartCount=document.getElementById("cart-count");

function loadCart(){
  const stored=localStorage.getItem("cart");
  cart=stored?JSON.parse(stored):[];
  updateCart(false);
}

function updateCart(save=true){
  const cartItems=document.getElementById("cart-items");
  cartItems.innerHTML="";
  if(cart.length===0){
    cartItems.innerHTML="<li>Warenkorb leer</li>";
  }else{
    cart.forEach((item,idx)=>{
      const li=document.createElement("li");
      li.innerHTML=`${item.name} (${item.size})`;
      cartItems.appendChild(li);
    });
  }
  cartCount.innerText=cart.length;
  if(save)localStorage.setItem("cart",JSON.stringify(cart));
}

const cartDrawer = document.getElementById("cart-dropdown");
const overlay = document.getElementById("cart-overlay");

document.getElementById("cart-icon").onclick = () => {
  cartDrawer.classList.add("show");
  overlay.classList.add("show");
};

overlay.onclick = () => {
  cartDrawer.classList.remove("show");
  overlay.classList.remove("show");
};
/* ADD DROPDOWN LOGIC */

const addBtn = document.getElementById("addBtn");
const sizeDropdown = document.getElementById("sizeDropdown");

addBtn.onclick = () => {
  sizeDropdown.style.display =
    sizeDropdown.style.display === "block" ? "none" : "block";
};

function addWithSize(size){
  cart.push({
    name:"PK-01",
    price:100,
    size:size
  });

  updateCart();
  sizeDropdown.style.display = "none";

  cartCount.style.transform="scale(1.3)";
  setTimeout(()=>cartCount.style.transform="scale(1)",200);
}

document.addEventListener("click",(e)=>{
  if(!e.target.closest(".add-wrapper")){
    sizeDropdown.style.display="none";
  }
});

loadCart();
</script>

</body>
</html>
