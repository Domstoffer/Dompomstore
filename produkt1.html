<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PK-01</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Montserrat',sans-serif;
  background:#ffffff;
  color:#111;
  text-align:center;
  animation:fadeIn .6s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

/* HEADER */
header{
  padding:20px;
  position:relative;
}

.back{
  position:absolute;
  left:20px;
  top:22px;
  text-decoration:none;
  color:#111;
  font-size:22px;
}

.cart-icon{
  position:absolute;
  right:20px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
}

.cart-icon svg{
  width:22px;   /* etwas kleiner */
  height:22px;
  stroke:#000;
  fill:none;
  stroke-width:1.5;
}

.cart-count{
  font-size:13px;
  font-weight:600;
  color:#000;
}

/* PRODUKT */
.product-container{
  padding:40px 20px;
}

.product-image{
  max-width:420px;
  margin:auto;
  overflow:hidden;
}

.image-track{
  display:flex;
  transition:transform .5s cubic-bezier(.4,.2,.2,1);
}

.image-track img{
  width:100%;
  flex-shrink:0;
  user-select:none;
  pointer-events:none;
}

.dots{
  margin:15px 0 40px 0;
}

.dots span{
  display:inline-block;
  width:6px;
  height:6px;
  background:#ccc;
  border-radius:50%;
  margin:0 4px;
  cursor:pointer;
}

.dots span.active{
  background:#000;
}

.product-title{
  font-size:22px;
  margin-bottom:20px;
}

.product-price{
  font-size:24px;
  letter-spacing:2px;
  margin-bottom:30px;
}

.product-info{
  max-height:0;
  overflow:hidden;
  opacity:0;
  transform:translateY(-10px);
  transition:
    max-height .45s cubic-bezier(.4,.0,.2,1),
    opacity .35s ease,
    transform .35s ease;
  margin-top:0;
  font-size:14px;
  line-height:1.7;
  letter-spacing:.05em;
}

.product-info.show{
  max-height:300px;
  opacity:1;
  transform:translateY(0);
  margin-top:25px;
}

/* ===== YEEZY STYLE ACTION SYSTEM ===== */

.action-wrapper{
  position:relative;
  margin-top:40px;
}

.add-btn{
  font-size:42px;
  border:none;
  background:none;
  cursor:pointer;
  transition:.3s ease;
  position:relative;
  z-index:2;
}

.add-btn.active{
  transform:translateY(-40px);
}

.action-panel{
  margin-top:20px;
  opacity:0;
  transform:translateY(-10px);
  pointer-events:none;
  transition:.35s ease;
}

.action-panel.show{
  opacity:1;
  transform:translateY(0);
  pointer-events:all;
}

.size-row{
  display:flex;
  justify-content:center;
  gap:60px;
  font-size:20px;
  letter-spacing:.2em;
  margin-bottom:30px;
}

.size-row span{
  cursor:pointer;
}

.size-row span:hover{
  opacity:.5;
}

.info-toggle{
  font-size:18px;
  letter-spacing:.2em;
  cursor:pointer;
  margin-bottom:15px;
}

.product-info{
  max-height:0;
  overflow:hidden;
  opacity:0;
  transition:.4s ease;
  font-size:14px;
  letter-spacing:.05em;
}

.product-info.show{
  max-height:200px;
  opacity:1;
}


/* CART DRAWER */
#cart-dropdown{
  position:fixed;
  top:0;
  right:-100%;
  width:320px;
  height:100%;
  background:#fff;
  padding:30px 20px;
  box-shadow:-10px 0 30px rgba(0,0,0,0.1);
  transition:.4s ease;
  text-align:left;
  z-index:1000;
}

#cart-dropdown.show{
  right:0;
}
.cart-title{
  font-size:18px;
  margin-bottom:20px;
}

#cart-items{
  margin-bottom:20px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
  font-size:14px;
}

.cart-left{
  display:flex;
  gap:10px;
}

.remove-item{
  cursor:pointer;
  font-weight:bold;
}

.cart-footer{
  position:absolute;
  bottom:30px;
  left:20px;
  right:20px;
}

.cart-total{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
  font-weight:600;
}

.checkout-btn{
  width:100%;
  padding:12px;
  background:#000;
  color:#fff;
  border:none;
  cursor:pointer;
}

.cart-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.2);
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

.cart-overlay.show{
  opacity:1;
  pointer-events:all;
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="back">‹</a>

  <div class="cart-icon" id="cart-icon">
    <span class="cart-count" id="cart-count">0</span>
    <svg xmlns="http://www.w3.org/2000/svg">
      <path d="M6 2l1 5h10l1-5z"/>
      <path d="M2 7h20v14H2z"/>
    </svg>
  </div>

 <div id="cart-dropdown">

  <h2 class="cart-title">Warenkorb</h2>

  <div id="cart-items"></div>

  <div class="cart-footer">
    <div class="cart-total">
      <span>Total</span>
      <span id="cart-total-price">0 USDC</span>
    </div>
    <button class="checkout-btn" onclick="goToCheckout()">Checkout</button>
  </div>

</div>
</header>

<div class="cart-overlay" id="cart-overlay"></div>

<div class="product-container">

<div class="product-image">
  <div class="image-track" id="imageTrack">
    <img src="images/DB-01.jpg">
    <img src="images/DB-00.jpg">
  </div>
</div>

  <div class="dots">
    <span class="active" onclick="setImg(0)"></span>
    <span onclick="setImg(1)"></span>
  </div>

  <div class="product-title">DH-01</div>
  <div class="product-price">49usdc</div>


<div class="action-wrapper">

  <button class="add-btn" id="addBtn">+</button>

  <div class="action-panel" id="actionPanel">

    <div class="size-row">
      <span onclick="addWithSize('S')">S</span>
      <span onclick="addWithSize('M')">M</span>
      <span onclick="addWithSize('L')">L</span>
    </div>

    <div class="info-toggle" id="infoToggle">INFORMATION</div>

    <div class="product-info" id="productInfo">
      Beste Badehose ever.
    </div>

  </div>
</div>


<script>

const imageTrack = document.getElementById("imageTrack");
let currentImg = 0;

function setImg(i){
  currentImg = i;
  imageTrack.style.transform = `translateX(-${i * 100}%)`;

  document.querySelectorAll(".dots span")
    .forEach((d,idx)=>d.classList.toggle("active",idx===i));
}


let startX = 0;

imageTrack.addEventListener("touchstart", e=>{
  startX = e.touches[0].clientX;
});

imageTrack.addEventListener("touchend", e=>{
  let diff = e.changedTouches[0].clientX - startX;

  if(diff > 50 && currentImg > 0){
    setImg(currentImg - 1);
  }

  if(diff < -50 && currentImg < 1){
    setImg(currentImg + 1);
  }
});

/* CART */
let cart=[];
const cartCount=document.getElementById("cart-count");

function loadCart(){
  const stored=localStorage.getItem("cart");
  cart=stored?JSON.parse(stored):[];
  updateCart(false);
}

function updateCart(save=true){

  const cartItems = document.getElementById("cart-items");
  const totalPriceEl = document.getElementById("cart-total-price");

  cartItems.innerHTML = "";
  let total = 0;

  if(cart.length === 0){
    cartItems.innerHTML = "<p style='font-size:14px;'>Warenkorb leer</p>";
  } else {

    cart.forEach((item,index)=>{

      total += item.price;

      const div = document.createElement("div");
      div.classList.add("cart-item");

      div.innerHTML = `
        <div class="cart-left">
          <span>${item.name}</span>
          <span>(${item.size})</span>
        </div>
        <div>
          <span>${item.price.toFixed(2)} USDC</span>
          <span class="remove-item" onclick="removeItem(${index})">×</span>
        </div>
      `;

      cartItems.appendChild(div);
    });
  }

  totalPriceEl.innerText = total.toFixed(2) + " USDC";
  cartCount.innerText = cart.length;

  if(save){
    localStorage.setItem("cart", JSON.stringify(cart));
  }
}
function removeItem(index){
  cart.splice(index,1);
  updateCart();
}

const cartDrawer = document.getElementById("cart-dropdown");
const overlay = document.getElementById("cart-overlay");

document.getElementById("cart-icon").onclick = () => {
  cartDrawer.classList.add("show");
  overlay.classList.add("show");
};

overlay.onclick = () => {
  cartDrawer.classList.remove("show");
  overlay.classList.remove("show");
};
/* ADD DROPDOWN LOGIC */

const addBtn = document.getElementById("addBtn");
const actionPanel = document.getElementById("actionPanel");
const infoToggle = document.getElementById("infoToggle");
const productInfo = document.getElementById("productInfo");

let actionOpen = false;

addBtn.onclick = () => {

  actionOpen = !actionOpen;

  if(actionOpen){
    addBtn.innerText = "×";
    addBtn.classList.add("active");
    actionPanel.classList.add("show");
  } else {
    addBtn.innerText = "+";
    addBtn.classList.remove("active");
    actionPanel.classList.remove("show");
    productInfo.classList.remove("show");
  }
};

infoToggle.onclick = () => {
  productInfo.classList.toggle("show");
};

function addWithSize(size){
  cart.push({
    name:"DH-01",
    price:49,
    size:size
  });

  updateCart();
 
  cartCount.style.transform="scale(1.3)";
  setTimeout(()=>cartCount.style.transform="scale(1)",200);
}

loadCart();
function goToCheckout(){
  if(cart.length === 0){
    alert("Warenkorb ist leer");
    return;
  }

  window.location.href = "checkout.html";
}
</script>

</body>
</html>
