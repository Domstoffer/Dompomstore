<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produkt 02 – test</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',sans-serif;background:#f4f4f9;color:#111}

header{padding:20px;text-align:center;font-size:2.5rem;font-weight:700;position:relative}
.back{display:block;text-align:center;margin-bottom:20px;color:#555;text-decoration:none}
.back:hover{color:#000}

.cart-icon{position:absolute;top:20px;right:40px;cursor:pointer;transition:transform .2s}
.cart-icon:hover{transform:scale(1.2)}
.cart-icon svg{width:28px;height:28px;stroke:#000;fill:none;stroke-width:2}

#cart-dropdown{
  display:none;
  position:absolute;
  top:70px;
  right:40px;
  width:350px;
  background:#fff;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  padding:15px;
  z-index:1000;
}
#cart-dropdown.show{display:block}
#cart-dropdown h3{
  font-size:1.2rem;
  margin-bottom:10px;
  border-bottom:1px solid #ddd;
  padding-bottom:6px;
}
#cart-items{
  list-style:none;
  max-height:220px;
  overflow-y:auto;
  margin-bottom:12px;
  padding-left:0;
}
#cart-items li{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:0.95rem;
  padding:8px 0;
  border-bottom:1px solid #eee;
}
#cart-items li:last-child{border-bottom:none}
#cart-items button{
  background:none;
  border:none;
  color:red;
  cursor:pointer;
  font-size:1.1rem;
}

#checkout-btn{
  width:100%;
  padding:12px;
  background:#00c271;
  color:#fff;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}
#checkout-btn:hover{background:#009957}

.container{max-width:1200px;margin:auto;padding:20px}
.product-block{display:flex;gap:40px;flex-wrap:wrap}

.main-image{width:100%;max-width:450px;border-radius:12px;cursor:pointer}
.sub-points{display:flex;gap:10px;justify-content:center;margin-top:12px}
.sub-points span{width:12px;height:12px;background:#ccc;border-radius:50%;cursor:pointer}
.sub-points span.active{background:#777}

.info{flex:1;display:flex;flex-direction:column;gap:15px}
.price{font-size:1.5rem;color:#00c271;font-weight:600}

.quantity input{width:60px;text-align:center}

.add-cart-btn{
  padding:14px;
  background:#00c271;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:600
}
.add-cart-btn:hover{background:#009957}
/* Warenkorb Öffnungs-Animation */
#cart-dropdown.show{
  display:block;
  animation: slideDown .25s ease;
}

@keyframes slideDown{
  from{opacity:0; transform:translateY(-10px)}
  to{opacity:1; transform:translateY(0)}
}

/* Cart Icon Bounce */
.cart-bounce{
  animation: bounce .4s ease;
}

@keyframes bounce{
  0%{transform:scale(1)}
  50%{transform:scale(1.3)}
  100%{transform:scale(1)}
}

/* Flug-Animation */
.fly-img{
  position:fixed;
  width:80px;
  border-radius:10px;
  pointer-events:none;
  z-index:2000;
  transition: all .6s cubic-bezier(.4,.2,.2,1);
}
</style>
</head>

<body>

<header>
  <span class="cart-icon" id="cart-icon">
    <svg xmlns="http://www.w3.org/2000/svg">
      <path d="M6 2l1 5h10l1-5z"/>
      <path d="M2 7h20v14H2z"/>
      <path d="M16 11a4 4 0 0 1-8 0"/>
    </svg>
  </span>

  <div id="cart-dropdown">
    <h3>Warenkorb</h3>
    <ul id="cart-items"><li>Der Warenkorb ist leer</li></ul>
    <button id="checkout-btn">Checkout</button>
  </div>
</header>

<a href="index.html" class="back">← Startseite</a>

<div class="container">
  <div class="product-block">

    <div>
      <img id="mainImage" class="main-image" src="https://picsum.photos/500/500?random=21">
      <div class="sub-points">
        <span class="active" onclick="setImg(0)"></span>
        <span onclick="setImg(1)"></span>
        <span onclick="setImg(2)"></span>
      </div>
    </div>

    <div class="info">
      <h2 id="productName">Hash</h2>
      <div class="price">100 USDT / USDC</div>

      <div class="quantity">
        Menge:
        <input type="number" id="qty" value="1" min="1">
      </div>

      <button class="add-cart-btn" onclick="addToCart()">Zum Warenkorb hinzufügen</button>
    </div>

  </div>
</div>

<script>
const imgs=[
 "https://picsum.photos/500/500?random=21",
 "https://picsum.photos/500/500?random=22",
 "https://picsum.photos/500/500?random=23"
];

function setImg(i){
  document.getElementById('mainImage').src=imgs[i];
  document.querySelectorAll('.sub-points span')
    .forEach((s,idx)=>s.classList.toggle('active',idx===i));
}

let cart=[];
const cartIcon=document.getElementById('cart-icon');
const cartDropdown=document.getElementById('cart-dropdown');
const cartItems=document.getElementById('cart-items');
const checkoutBtn=document.getElementById('checkout-btn');

// 🔹 PRODUKTDATEN
const productName = "Hash";
const productPrice = 100; // ← Preis hier fest definiert

function loadCart(){
  const stored=localStorage.getItem('cart');
  cart=stored?JSON.parse(stored):[];
  updateCart(false);
}

function updateCart(save=true){
  cartItems.innerHTML='';

  if(cart.length===0){
    cartItems.innerHTML='<li>Der Warenkorb ist leer</li>';
    if(save) localStorage.setItem('cart',JSON.stringify(cart));
    return;
  }

  let total=0;

  cart.forEach((item,idx)=>{
    const li=document.createElement('li');

    const sum = item.price * item.quantity;
    total += sum;

    li.innerHTML=`
      ${item.name} x${item.quantity} (${sum.toFixed(2)})
      <button data-index="${idx}">×</button>
    `;
    cartItems.appendChild(li);
  });

  const totalLi=document.createElement('li');
  totalLi.style.fontWeight="bold";
  totalLi.innerHTML=`Gesamt: ${total.toFixed(2)} USDC`;
  cartItems.appendChild(totalLi);

  if(save) localStorage.setItem('cart',JSON.stringify(cart));
}

cartItems.addEventListener('click',e=>{
  if(e.target.tagName==='BUTTON'){
    cart.splice(e.target.dataset.index,1);
    updateCart();
    e.stopPropagation();
  }
});

cartIcon.onclick=e=>{
  e.stopPropagation();
  loadCart();
  cartDropdown.classList.toggle('show');
};

document.addEventListener('click',e=>{
  if(!cartDropdown.contains(e.target)&&e.target!==cartIcon){
    cartDropdown.classList.remove('show');
  }
});

function addToCart(){

  loadCart();

  const qty=parseInt(document.getElementById('qty').value)||1;

  const existing=cart.find(i=>i.name===productName);

  if(existing){
    existing.quantity+=qty;
  }else{
    cart.push({
      name:productName,
      price:productPrice,
      quantity:qty
    });
  }

  updateCart();

  cartDropdown.classList.add('show');

  cartIcon.classList.add('cart-bounce');
  setTimeout(()=>cartIcon.classList.remove('cart-bounce'),400);

  const img=document.getElementById('mainImage');
  const rect=img.getBoundingClientRect();
  const cartRect=cartIcon.getBoundingClientRect();

  const fly=document.createElement('img');
  fly.src=img.src;
  fly.className='fly-img';
  fly.style.left=rect.left+'px';
  fly.style.top=rect.top+'px';
  document.body.appendChild(fly);

  setTimeout(()=>{
    fly.style.left=cartRect.left+'px';
    fly.style.top=cartRect.top+'px';
    fly.style.width='20px';
    fly.style.opacity='0.5';
  },10);

  setTimeout(()=>fly.remove(),650);
}

checkoutBtn.onclick=()=>{
  loadCart();
  if(cart.length===0){
    alert('Warenkorb leer');
    return;
  }
  window.location.href='checkout.html';
};

loadCart();
</script>
</body>
</html>
