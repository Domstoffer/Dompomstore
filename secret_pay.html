  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff;
      --text: #000000;
      --border: rgba(0,0,0,0.1);
      --accent: #f4f4f4;
      --glass: rgba(255,255,255,0.8);
    }
    .dark-mode {
      --bg: #000000;
      --text: #ffffff;
      --border: rgba(255,255,255,0.15);
      --accent: #111111;
      --glass: rgba(0,0,0,0.8);
    }
    
    @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes fadeMask { from { mask-position: 200% center; -webkit-mask-position: 200% center; } to { mask-position: 0% center; -webkit-mask-position: 0% center; } }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* SPLIT SCREEN LAYOUT */
    .vanguard-layout {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .vanguard-left {
      background: var(--accent);
      padding: 60px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .vanguard-left::after {
      content: 'DOMPOM';
      position: absolute;
      top: -5%;
      left: -5%;
      font-family: 'Syncopate', sans-serif;
      font-size: 25vw;
      font-weight: 700;
      color: var(--text);
      opacity: 0.03;
      pointer-events: none;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      z-index: 0;
    }

    .vanguard-right {
      padding: 60px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      animation: slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @media(min-width: 900px) {
      .vanguard-layout {
        flex-direction: row;
      }
      .vanguard-left {
        width: 45vw;
        height: 100vh;
        position: fixed;
        top: 0; left: 0;
        padding: 80px 60px;
      }
      .vanguard-right {
        width: 55vw;
        margin-left: 45vw;
        min-height: 100vh;
        padding: 80px 10%;
      }
    }

    .back-nav {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--text);
      opacity: 0.5;
      transition: opacity 0.4s;
      z-index: 10;
      position: relative;
    }
    .back-nav:hover { opacity: 1; }

    .step-indicator {
      font-family: 'Syncopate', sans-serif;
      font-size: 10px;
      letter-spacing: 0.4em;
      opacity: 0.4;
      margin-bottom: 20px;
      z-index: 10;
      position: relative;
    }

    .huge-title {
      font-family: 'Syncopate', sans-serif;
      font-weight: 400;
      font-size: 2.5rem;
      line-height: 1.1;
      text-transform: uppercase;
      margin-bottom: 50px;
      letter-spacing: 0.05em;
      animation: reveal 1.5s cubic-bezier(0.77, 0, 0.175, 1) forwards;
    }
    
    .huge-title i {
      font-style: italic;
      font-weight: 300;
      color: gray;
    }

    /* ORDER REVIEW LIST */
    .order-review {
      z-index: 10;
      position: relative;
    }
    .order-item-vanguard {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding: 20px 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .order-total-vanguard {
      display: flex;
      justify-content: space-between;
      padding: 30px 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.15em;
    }

    /* FORMS */
    .v-form {
      display: flex;
      flex-direction: column;
      gap: 35px;
    }
    .v-input-group {
      position: relative;
    }
    .v-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      padding: 10px 0;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.4s;
    }
    .v-input:focus {
      border-bottom-color: var(--text);
    }
    .v-label {
      position: absolute;
      top: 10px;
      left: 0;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text);
      opacity: 0.4;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .v-input:focus ~ .v-label, .v-input:valid ~ .v-label {
      top: -20px;
      font-size: 9px;
      opacity: 1;
    }

    /* BUTTONS */
    .v-btn {
      display: inline-block;
      width: 100%;
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 24px;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      margin-top: 20px;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .v-btn::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1;
    }
    .v-btn span {
      position: relative;
      z-index: 2;
      transition: color 0.6s;
    }
    .v-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }
    .v-btn:hover::before {
      transform: scaleY(1);
    }
    .v-btn:hover span {
      color: var(--text);
    }
    .dark-mode .v-btn:hover {
      box-shadow: 0 20px 40px rgba(255,255,255,0.05);
    }

    /* WALLET BOXES */
    .wallet-box {
      border: 1px solid var(--border);
      padding: 30px 25px;
      display: flex;
      align-items: center;
      gap: 20px;
      cursor: pointer;
      margin-bottom: 20px;
      background: transparent;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .wallet-box img {
      width: 32px; height: 32px;
      transition: transform 0.5s;
    }
    .wallet-info {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .wallet-name {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .wallet-chain {
      font-size: 9px;
      opacity: 0.5;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .wallet-box:hover {
      background: var(--accent);
      border-color: var(--text);
    }
    .wallet-box:hover img {
      transform: scale(1.1) rotate(5deg);
    }

    .payment-area {
      display:none; 
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      margin-top: 40px;
      padding-top: 40px;
      border-top: 1px solid var(--border);
    }
    
    .token-pill {
      display: inline-block;
      padding: 12px 24px;
      border: 1px solid var(--border);
      border-radius: 50px;
      font-size: 10px;
      letter-spacing: 0.15em;
      margin: 0 10px 10px 0;
      cursor: pointer;
      transition: all 0.3s;
    }
    .token-pill.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    /* --- MOBILE UX PREMIUM FIXES --- */
    /* CART RESPONSIVE FIX */
    

    /* INPUT IOS FIX (Prevent Auto-Zoom) */
    input, select, textarea {
      font-size: 16px !important;
    }

    @media (max-width: 500px) {
      /* PRODUCT CAROUSEL FIX */
      .container {
        display: flex !important;
        flex-direction: row !important;
        overflow-x: auto !important;
        scroll-snap-type: x mandatory !important;
        gap: 15px !important;
        padding-bottom: 20px !important; /* scrollbar padding */
        -webkit-overflow-scrolling: touch;
      }
      
      .container::-webkit-scrollbar {
        display: none; /* Hide scrollbar for clean UI */
      }
      
      .product-box {
        min-width: 90% !important;
        scroll-snap-align: center !important;
        flex: 0 0 auto !important;
      }
      
      /* STICKY CTA Product Pages */
      .add-to-cart {
        position: fixed !important;
        bottom: 0 !important;
        left: 0 !important;
        width: 100% !important;
        margin-bottom: 0 !important;
        padding-bottom: calc(26px + env(safe-area-inset-bottom)) !important;
        z-index: 1000 !important;
      }
      
      /* Ensure info-side doesn't overlap the fixed CTA */
      .info-side {
        padding-bottom: 120px !important; 
      }
    }


    /* --- LUXURY MOBILE REDESIGN --- */
    
    /* BOTTOM SHEET CART */
    

    /* LUXURY TYPOGRAPHY */
    body {
      font-family: 'Inter', sans-serif !important;
    }
    h1, h2, h3, .brand-logo, .huge-title, .cart-title, .step-indicator {
      font-family: 'Syncopate', sans-serif !important;
    }

    @media (max-width: 768px) {
      /* FULLSCREEN HERO (Index only) */
      .mobile-hero {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        height: 100vh;
        width: 100vw;
        position: relative;
        left: 50%;
        transform: translateX(-50%);
        background: var(--bg);
        z-index: 5;
        border-bottom: 1px solid var(--border);
        margin-bottom: 40px;
      }
      .mobile-hero-title {
        font-family: 'Syncopate', sans-serif;
        font-size: 2.5rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      .mobile-hero-subtitle {
        font-family: 'Inter', sans-serif;
        font-size: 11px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        opacity: 0.5;
        margin-bottom: 40px;
      }
      .mobile-hero-btn {
        padding: 18px 40px;
        background: var(--text);
        color: var(--bg);
        font-size: 10px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        text-decoration: none;
        border-radius: 50px;
      }

      /* LUXURY PRODUCT CARDS */
      .product-box {
        background: var(--accent) !important;
        border-radius: 16px !important;
        overflow: hidden !important;
        padding-bottom: 20px !important;
      }
      .image-wrapper {
        border-radius: 16px 16px 0 0 !important;
        margin-bottom: 15px !important;
      }
      .product-info-grid {
        padding: 0 20px !important;
        align-items: center !important;
        text-align: center !important;
      }
      .product-name {
        font-size: 14px !important;
        font-weight: 600 !important;
      }
      .product-price {
        font-size: 13px !important;
        font-weight: 400 !important;
        color: var(--text) !important;
        opacity: 0.7 !important;
        margin-top: 5px !important;
      }
    }


/* PREVENT DOUBLE TAP ZOOM */
    html, body {
      touch-action: manipulation !important;
    }



    
</style>

    <!-- RIGHT PANE: WALLETS -->
    <div class="vanguard-right">

      <div class="wallet-box" onclick="selectNetwork('solana')">
        <svg width="24" height="24" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="128" height="128" rx="28" fill="#AB9FF2"/><g transform="translate(18, 18) scale(0.72)"><path d="M117.9 31C117.9 31 106 14.3 84.1 6.5C62.1 -1.4 39.5 0.5 39.5 0.5C39.5 0.5 45.4 7.6 42.1 19C38.8 30.4 23.6 29 23.6 29C23.6 29 26 38.5 22.2 46.1C18.4 53.7 9.80005 55.6 9.80005 55.6C9.80005 55.6 15 63.6 12.6 72.2C10.2 80.8 1.6 83.1 1.6 83.1C-3.2 104.9 5.39999 127.4 5.39999 127.4C5.39999 127.4 30.6 116 48.1 118.9C65.6 121.8 81.3 127.5 81.3 127.5C81.3 127.5 106.8 102.3 117.3 75.2C127.8 48.1 117.9 31 117.9 31ZM40 91.8C35.5 91.8 31.8 88.1 31.8 83.6C31.8 79.1 35.5 75.4 40 75.4C44.5 75.4 48.2 79.1 48.2 83.6C48.2 88.1 44.5 91.8 40 91.8ZM81.6 77.2C72.8 77.2 65.7 70.1 65.7 61.3C65.7 52.5 72.8 45.4 81.6 45.4C90.4 45.4 97.5 52.5 97.5 61.3C97.5 70.1 90.4 77.2 81.6 77.2Z" fill="white"/></g></svg>

  <script>
    const order = JSON.parse(localStorage.getItem("currentOrder"));
    if (!order) {
      window.location.href = "secret_checkout.html";
    }

    let totalUsd = 0;
    let cart = JSON.parse(localStorage.getItem("cart") || "[]");
    let itemsHTML = "";
    cart.forEach(item => {
      const qty = Number(item.quantity) || 1;
      const sum = item.price * qty;
      totalUsd += sum;
      itemsHTML += `<div class="order-item-vanguard"><span>${item.name} × ${qty}</span><span>${sum.toFixed(2)} USD</span></div>`;
    });

    document.getElementById("summaryContent").innerHTML = itemsHTML + `<div class="order-total-vanguard"><span>TOTAL</span><span>${totalUsd.toFixed(2)} USD</span></div>`;
    document.getElementById("orderIdDisplay").innerText = order.id;

    
    let cryptoRates = {};
    async function fetchCryptoRates() {
      try {
        const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=ethereum,solana,binancecoin,pepe,fartcoin&vs_currencies=usd');
        const data = await res.json();
        cryptoRates = {
          ETH: data?.ethereum?.usd || 3001,
          SOL: data?.solana?.usd || 150,
          BNB: data?.binancecoin?.usd || 400,
          PEPE: data?.pepe?.usd || 0.00001,
          FARTCOIN: data?.fartcoin?.usd || 0.005,
          USDC: 1,
          BNB_USDC: 1,
          LINEA_USDC: 1
        };
        if (activeToken) updateTotalDisplay(activeToken);
      } catch(e) { console.error('Error fetching crypto rates', e); }
    }
    fetchCryptoRates(); // Fetch immediately on load
        
    let activeNetwork = null;
    let activeToken = null;

    function selectNetwork(network) {
      activeNetwork = network;
      document.getElementById('paymentArea').style.display = 'block';
      const container = document.getElementById('tokensContainer');
      container.innerHTML = '';

      let tokens = [];
      const source = localStorage.getItem('shopSource') || 'public';

      if (source === 'private') {
        if (network === 'solana') tokens = ['USDC'];
        else tokens = ['USDC', 'ETH', 'BNB_USDC', 'BNB', 'LINEA_USDC'];
      } else {
        if (network === 'solana') tokens = ['USDC', 'SOL', 'FARTCOIN'];
        else tokens = ['ETH', 'USDC', 'PEPE'];
      }

      tokens.forEach((t, index) => {
        const btn = document.createElement('div');
        btn.className = `token-pill ${index === 0 ? 'active' : ''}`;
        btn.innerText = t;
        btn.onclick = () => {
          document.querySelectorAll('.token-pill').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeToken = t;
          updateTotalDisplay(t);
        };
        container.appendChild(btn);
      });
      activeToken = tokens[0];
      updateTotalDisplay(activeToken);
    }

    function updateTotalDisplay(token) {
      const isDiscounted = ['PEPE', 'PEPPE', 'FARTCOIN'].includes(token);
      const finalUsd = isDiscounted ? totalUsd * 0.90 : totalUsd;
      
      let cryptoAmountHtml = '';
      if (cryptoRates[token]) {
        const amount = finalUsd / cryptoRates[token];
        const decimals = token.includes('USDC') ? 2 : (['PEPE', 'FARTCOIN'].includes(token) ? 0 : 5);
        const formattedAmount = ['PEPE', 'FARTCOIN'].includes(token) ? Math.ceil(amount).toLocaleString() : amount.toFixed(decimals);
        cryptoAmountHtml = `<div style="font-size:12px; font-weight:400; font-family:'Inter',sans-serif; letter-spacing:0.1em; color:var(--text); opacity:0.6; margin-top:8px; text-transform:none;">≈ ${formattedAmount} ${token}</div>`;
      } else {
        cryptoAmountHtml = `<div style="font-size:10px; opacity:0.3; margin-top:5px; text-transform:uppercase;">Fetching live market rates...</div>`;
      }

      let totalHtml = `
      <div class="order-total-vanguard" style="flex-direction: column; align-items: flex-end; padding:20px 0;">
        <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
            <span>TOTAL ${isDiscounted ? '<span style="color:#14F195; font-size:10px; margin-left:10px;">(10% OFF 💎)</span>' : ''}</span>
            <span>${isDiscounted ? `<span style="text-decoration:line-through; opacity:0.5; font-size:11px; margin-right:5px;">${totalUsd.toFixed(2)}</span>` : ''}${finalUsd.toFixed(2)} USD</span>
        </div>
        ${cryptoAmountHtml}
      </div>`;
      
      document.getElementById("summaryContent").innerHTML = itemsHTML + totalHtml;
    }

    async function executePayment() {
      const btn = document.getElementById('payFinalBtn');
      btn.innerHTML = "<span>Processing...</span>";
      btn.style.pointerEvents = 'none';

      try {
        if (activeNetwork === 'solana') await payWithPhantom();
        else if (activeNetwork === 'ethereum') await payWithMetaMask();
      } catch (e) {
        console.error(e);
        alert("Payment Failed: " + e.message);
      } finally {
        btn.innerHTML = "<span>Execute Transfer</span>";
        btn.style.pointerEvents = 'all';
      }
    }

    paypal.Buttons({
      createOrder: function (data, actions) {
        return actions.order.create({
          purchase_units: [{ amount: { value: totalUsd.toFixed(2) } }]
        });
      },
      onApprove: function (data, actions) {
        return actions.order.capture().then(function (details) {
          fetch(`http://${window.location.hostname}:3001/api/verify-paypal`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ orderId: order.id, paypalOrderId: details.id })
          }).then(res => res.json()).then(res => {
            if (res.success) window.location.href = "secret_thankyou.html";
            else alert("PayPal Verification Error");
          });
        });
      }
    }).render('#paypal-button-container');

    async function payWithPhantom() {
      const provider = window.solana;
      if (!provider || !provider.isPhantom) throw new Error("Phantom not found.");
      await provider.connect();
      const sender = provider.publicKey;
      const connection = new solanaWeb3.Connection("https://api.mainnet-beta.solana.com");

      const blockhash = (await connection.getLatestBlockhash('finalized')).blockhash;
      const tx = new solanaWeb3.Transaction().add(
        solanaWeb3.SystemProgram.transfer({
          fromPubkey: sender,
          toPubkey: new solanaWeb3.PublicKey("Cx2TAKyUxVZ3xtWZoTpqmnGcnvkUvoghoKafpsK3KuCp"),
          lamports: 10000 
        })
      );
      tx.feePayer = sender;
      tx.recentBlockhash = blockhash;

      const { signature } = await provider.signAndSendTransaction(tx);
      const req = await fetch(`http://${window.location.hostname}:3001/api/verify-payment`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ orderId: order.id, signature: signature, token: activeToken })
      });
      const res = await req.json();
      if (res.success) window.location.href = "secret_thankyou.html";
      else throw new Error("Server verification failed.");
    }

    async function payWithMetaMask() {
      if (!window.ethereum) throw new Error("MetaMask not found.");
      await window.ethereum.request({ method: 'eth_requestAccounts' });
      const provider = new ethers.BrowserProvider(window.ethereum);
      const signer = await provider.getSigner();

      const tx = await signer.sendTransaction({
        to: "0x8fc73bf2168af15395037efb692eda6375f54a1e", 
        value: ethers.parseEther("0.0001") 
      });
      const receipt = await tx.wait();

      const req = await fetch(`http://${window.location.hostname}:3001/api/verify-evm-payment`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ orderId: order.id, txHash: receipt.hash, sender: signer.address, token: activeToken })
      });
      const res = await req.json();
      if (res.success) window.location.href = "secret_thankyou.html";
      else throw new Error("Server verification failed.");
    }
  </script>

<script>
let lastTouchEnd = 0;
document.addEventListener('touchend', function (event) {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) {
    event.preventDefault();
  }
  lastTouchEnd = now;
}, false);
</script>
