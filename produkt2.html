<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Product – Dompomstore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syncopate:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    /* PREMIUM MINIMAL THEME */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      color: #000000;
      -webkit-font-smoothing: antialiased;
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 25px;
      background: #ffffff;
      z-index: 100;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .logo {
      font-family: 'Syncopate', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #000;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      text-decoration: none;
    }

    .back-link {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-decoration: none;
      color: #000;
      opacity: 0.5;
      transition: opacity 0.3s;
      text-transform: uppercase;
    }

    .back-link:hover {
      opacity: 1;
    }

    .cart-icon {
      position: relative;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .cart-icon svg {
      width: 20px;
      height: 20px;
      stroke: #000;
      fill: none;
      stroke-width: 1.5;
      transition: transform 0.2s;
    }

    .cart-icon:hover svg {
      transform: scale(1.05);
    }

    .cart-count {
      position: absolute;
      top: -6px;
      right: -10px;
      background: #000;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 10px;
    }

    /* CART DRAWER */
    #cart-dropdown {
      position: fixed;
      top: 0;
      right: -100%;
      width: 320px;
      height: 100%;
      background: #ffffff;
      color: #111;
      padding: 0;
      box-shadow: -5px 0 20px rgba(0, 0, 0, 0.05);
      transition: right 0.4s cubic-bezier(0.8, 0, 0.2, 1);
      z-index: 1000;
      display: flex;
      flex-direction: column;
    }

    #cart-dropdown.show {
      right: 0;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }

    .cart-header h2 {
      font-family: 'Syncopate', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .close-cart {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #000;
      opacity: 0.5;
      transition: opacity 0.2s;
    }

    #cart-items {
      flex-grow: 1;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .cart-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .cart-item-name {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .cart-item-size {
      color: #777;
      font-size: 12px;
    }

    .remove-item {
      cursor: pointer;
      font-weight: bold;
      color: #999;
      transition: color 0.2s ease;
      font-size: 18px;
      margin-left: 15px;
    }

    .remove-item:hover {
      color: #000;
    }

    .cart-footer {
      padding: 24px;
      border-top: 1px solid rgba(0, 0, 0, 0.1);
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }

    .checkout-btn {
      display: block;
      width: 100%;
      padding: 18px;
      background: #000;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: background 0.3s;
      border: none;
      cursor: pointer;
    }

    .checkout-btn:hover {
      background: #222;
    }

    .cart-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: .4s;
      z-index: 999;
    }

    .cart-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    /* SPLIT LAYOUT */
    .split-layout {
      display: flex;
      min-height: 100vh;
      margin-top: 50px;
      /* Header spacing */
    }

    .image-side {
      width: 55vw;
      height: calc(100vh - 50px);
      position: sticky;
      top: 50px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      
    }

    .image-track {
      width: 100%;
      height: 100%;
    }

    .image-track img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 80px;
    }

    .info-side {
      width: 45vw;
      padding: 100px;
      justify-content: center;
      display: flex;
      flex-direction: column;
    }

    .product-title {
      font-family: 'Syncopate', sans-serif;
      font-size: 2.8rem;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      line-height: 1.1;
      color: #000;
      text-transform: uppercase;
    }

    .product-price {
      font-size: 1.4rem;
      font-weight: 300;
      color: #000;
      margin-bottom: 60px;
      letter-spacing: 0.05em;
    }

    .size-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 16px;
      color: #777;
    }

    .size-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 40px;
    }

    .size-btn {
      padding: 14px 0;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background: transparent;
      color: #000;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .size-btn:hover {
      border-color: #000;
    }

    .size-btn.selected {
      background: #000;
      color: #fff;
      border-color: #000;
      font-weight: 600;
    }

    .add-to-cart {
      width: 100%;
      background: #000;
      color: #fff;
      border: none;
      padding: 26px 0;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
      margin-bottom: 60px;
    }

    .add-to-cart:hover {
      background: #222;
      transform: translateY(-2px);
    }

    .info-accordion {
      border-top: 1px solid rgba(0, 0, 0, 0.1);
    }

    .accordion-header {
      padding: 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s ease;
      font-size: 14px;
      line-height: 1.8;
      color: #777;
    }

    .accordion-content p {
      padding-bottom: 24px;
    }

    .accordion-content.open {
      max-height: 500px;
    }

    @media (max-width: 900px) {
      .split-layout {
        flex-direction: column;
      }

      .image-side {
        width: 100%;
        height: 60vh;
        border-right: none;
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      }

      .info-side {
        width: 100%;
        padding: 40px 24px 100px 24px;
      }

      .product-title {
        font-size: 1.8rem;
      }

      .cart-drawer {
        width: 100%;
        right: -100%;
      }
    }
  
    /* --- MOBILE UX PREMIUM FIXES --- */
    /* CART RESPONSIVE FIX */
    #cart-dropdown {
      width: 100%;
      max-width: 100vw;
    }

    /* INPUT IOS FIX (Prevent Auto-Zoom) */
    input, select, textarea {
      font-size: 16px !important;
    }

    @media (max-width: 500px) {
      /* PRODUCT CAROUSEL FIX */
      .container {
        display: flex !important;
        flex-direction: row !important;
        overflow-x: auto !important;
        scroll-snap-type: x mandatory !important;
        gap: 15px !important;
        padding-bottom: 20px !important; /* scrollbar padding */
        -webkit-overflow-scrolling: touch;
      }
      
      .container::-webkit-scrollbar {
        display: none; /* Hide scrollbar for clean UI */
      }
      
      .product-box {
        min-width: 90% !important;
        scroll-snap-align: center !important;
        flex: 0 0 auto !important;
      }
      
      /* STICKY CTA Product Pages */
      .add-to-cart {
        position: fixed !important;
        bottom: 0 !important;
        left: 0 !important;
        width: 100% !important;
        margin-bottom: 0 !important;
        padding-bottom: calc(26px + env(safe-area-inset-bottom)) !important;
        z-index: 1000 !important;
      }
      
      /* Ensure info-side doesn't overlap the fixed CTA */
      .info-side {
        padding-bottom: 120px !important; 
      }
    }


    /* --- LUXURY MOBILE REDESIGN --- */
    
    /* BOTTOM SHEET CART */
    #cart-dropdown {
      top: auto !important;
      bottom: -100% !important;
      right: 0 !important;
      left: 0 !important;
      width: 100% !important;
      max-width: 100vw !important;
      height: 80vh !important;
      border-radius: 25px 25px 0 0 !important;
      border-top: 1px solid var(--border) !important;
      border-left: none !important;
      transition: bottom 0.5s cubic-bezier(0.16, 1, 0.3, 1) !important;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.1) !important;
    }
    #cart-dropdown.show {
      bottom: 0 !important;
    }

    /* LUXURY TYPOGRAPHY */
    body {
      font-family: 'Inter', sans-serif !important;
    }
    h1, h2, h3, .brand-logo, .huge-title, .cart-title, .step-indicator {
      font-family: 'Syncopate', sans-serif !important;
    }

    @media (max-width: 768px) {
      /* FULLSCREEN HERO (Index only) */
      .mobile-hero {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        height: 100vh;
        width: 100vw;
        position: relative;
        left: 50%;
        transform: translateX(-50%);
        background: var(--bg);
        z-index: 5;
        border-bottom: 1px solid var(--border);
        margin-bottom: 40px;
      }
      .mobile-hero-title {
        font-family: 'Syncopate', sans-serif;
        font-size: 2.5rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      .mobile-hero-subtitle {
        font-family: 'Inter', sans-serif;
        font-size: 11px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        opacity: 0.5;
        margin-bottom: 40px;
      }
      .mobile-hero-btn {
        padding: 18px 40px;
        background: var(--text);
        color: var(--bg);
        font-size: 10px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        text-decoration: none;
        border-radius: 50px;
      }

      /* LUXURY PRODUCT CARDS */
      .product-box {
        background: var(--accent) !important;
        border-radius: 16px !important;
        overflow: hidden !important;
        padding-bottom: 20px !important;
      }
      .image-wrapper {
        border-radius: 16px 16px 0 0 !important;
        margin-bottom: 15px !important;
      }
      .product-info-grid {
        padding: 0 20px !important;
        align-items: center !important;
        text-align: center !important;
      }
      .product-name {
        font-size: 14px !important;
        font-weight: 600 !important;
      }
      .product-price {
        font-size: 13px !important;
        font-weight: 400 !important;
        color: var(--text) !important;
        opacity: 0.7 !important;
        margin-top: 5px !important;
      }
    }

</style>

      </div>

  <script>
    // --- Variables that vary per product ---
    const PRODUCT_NAME = "PS-01";
    const PRODUCT_PRICE = 19;
    // ----------------------------------------

    let cart = [];
    const cartCount = document.getElementById("cartCount");
    const cartDrawer = document.getElementById("cart-dropdown");
    const overlay = document.getElementById("cart-overlay");
    const closeCartBtn = document.getElementById("close-cart");

    function loadCart() {
      const stored = localStorage.getItem("cart");
      cart = stored ? JSON.parse(stored) : [];
      updateCart(false);
    }

    function updateCart(save = true) {
      const cartItems = document.getElementById("cart-items");
      const totalPriceEl = document.getElementById("cart-total-price");

      cartItems.innerHTML = "";
      let total = 0;

      if (cart.length === 0) {
        cartItems.innerHTML = "<p style='font-size:14px; padding: 24px;'>Warenkorb leer</p>";
      } else {
        cart.forEach((item, index) => {
          total += item.price;
          const div = document.createElement("div");
          div.classList.add("cart-item");
          div.innerHTML = `
        <div class="cart-left">
          <span class="cart-item-name">${item.name}</span>
          <span class="cart-item-size">Size: ${item.size || "One Size"}</span>
        </div>
        <div style="display:flex; align-items:center;">
          <span style="font-weight: 500;">${item.price} USDC</span>
          <span class="remove-item" onclick="removeItem(${index})">×</span>
        </div>
      `;
          cartItems.appendChild(div);
        });
      }

      totalPriceEl.innerText = total + " USDC";
      cartCount.style.display = cart.length > 0 ? "flex" : "none";
      cartCount.innerText = cart.length;

      if (save) localStorage.setItem("cart", JSON.stringify(cart));
    }

    function removeItem(index) {
      cart.splice(index, 1);
      updateCart();
    }

    document.getElementById("cart-icon").onclick = () => {
      cartDrawer.classList.toggle("show");
      overlay.classList.toggle("show");
    };

    closeCartBtn.onclick = () => {
      cartDrawer.classList.remove("show");
      overlay.classList.remove("show");
    };

    overlay.onclick = () => {
      cartDrawer.classList.remove("show");
      overlay.classList.remove("show");
    };

    window.addEventListener("pageshow", function () {
      loadCart();
    });

    let selectedSize = null;

    function selectSize(size, el) {
      selectedSize = size;
      document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('selected'));
      el.classList.add('selected');
    }

    
    function addToCart() {
      const sizeList = document.querySelectorAll('.size-pill');
      let selectedSize = null;
      sizeList.forEach(p => { if (p.classList.contains('selected')) selectedSize = p.innerText; });
      if (!selectedSize) { alert('Bitte wähle eine Größe'); return; }
      
      const existingItem = cart.find(i => i.name === PRODUCT_NAME && i.size === selectedSize);
      if (existingItem) {
        // Just open the cart, it's already there
      } else {
        cart.push({ name: PRODUCT_NAME, price: PRODUCT_PRICE, size: selectedSize, qty: 1 });
      }
      
      updateCart();
      document.getElementById('cart-dropdown').classList.add('show');
      document.getElementById('cart-overlay').classList.add('show');
    }
    

    function toggleAccordion(id) {
      const content = document.getElementById(`content-${id}`);
      const icon = document.getElementById(`icon-${id}`);

      if (content.classList.contains('open')) {
        content.classList.remove('open');
        icon.innerText = "+";
      } else {
        content.classList.add('open');
        icon.innerText = "-";
      }
    }

    document.getElementById('goToCheckoutBtn').addEventListener('click', () => {
      if (cart.length === 0) {
        alert('Dein Warenkorb ist leer!');
        return;
      }
      window.location.href = 'checkout.html';
    });

    loadCart();
  
    const descToggle = document.querySelector(".desc-toggle");
    const descContent = document.querySelector(".desc-content");
    if (descToggle && descContent) {
      descToggle.onclick = function(){
        if(descContent.style.display === "block"){
          descContent.style.display = "none";
          descToggle.textContent = "Beschreibung +";
        } else {
          descContent.style.display = "block";
          descToggle.textContent = "Beschreibung −";
        }
      }
    }
    
  </script>
</body>
