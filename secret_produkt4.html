    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syncopate:wght@400;700&display=swap"

  <style>
    /* PREMIUM MINIMAL THEME */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body { font-family: 'Inter', sans-serif; background: #000000; color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 25px;
      background: #000000;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo {
      font-family: 'Syncopate', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #fff;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      text-decoration: none;
    }

    .back-link {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-decoration: none;
      color: #fff;
      opacity: 0.5;
      transition: opacity 0.3s;
      text-transform: uppercase;
    }

    .back-link:hover {
      opacity: 1;
    }

    .cart-icon {
      position: relative;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .cart-icon svg {
      width: 20px;
      height: 20px;
      stroke: #fff;
      fill: none;
      stroke-width: 1.5;
      transition: transform 0.2s;
    }

    .cart-icon:hover svg {
      transform: scale(1.05);
    }

    .cart-count {
      position: absolute;
      top: -6px;
      right: -10px;
      background: #fff;
      color: #000;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 10px;
    }

    /* CART DRAWER */
    /* CART DRAWER */
    #cart-dropdown {
      position: fixed;
      top: 0;
      right: -100%;
      width: 400px;
      height: 100vh;
      background: var(--bg);
      border-left: 1px solid var(--border);
      padding: 60px 40px;
      transition: right 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      display: flex;
      flex-direction: column;
    }

    #cart-dropdown.show {
      right: 0;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .cart-header h2 {
      font-family: 'Syncopate', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .close-cart {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #fff;
      opacity: 0.5;
      transition: opacity 0.2s;
    }

    #cart-items {
      flex-grow: 1;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .cart-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .cart-item-name {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .cart-item-size {
      color: #777;
      font-size: 12px;
    }

    .remove-item {
      cursor: pointer;
      font-weight: bold;
      color: #999;
      transition: color 0.2s ease;
      font-size: 18px;
      margin-left: 15px;
    }

    .remove-item:hover {
      color: #000;
    }

    .cart-footer {
      padding: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }

    .checkout-btn {
      display: block;
      width: 100%;
      padding: 18px;
      background: #fff;
      color: #000;
      text-align: center;
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: background 0.3s;
      border: none;
      cursor: pointer;
    }

    .checkout-btn:hover { background: #eee;
    }

    .cart-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: .4s;
      z-index: 999;
    }

    .cart-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    /* SPLIT LAYOUT */
    .split-layout {
      display: flex;
      min-height: 100vh;
      margin-top: 50px;
      /* Header spacing */
    }

    .image-side {
      width: 55vw;
      height: calc(100vh - 50px);
      position: sticky;
      top: 50px;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      
    }

    .image-track {
      width: 100%;
      height: 100%;
    }

    .image-track img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 80px;
    }

    .info-side {
      width: 45vw;
      padding: 100px;
      justify-content: center;
      display: flex;
      flex-direction: column;
    }

    .product-title {
      font-family: 'Syncopate', sans-serif;
      font-size: 2.8rem;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      line-height: 1.1;
      color: #fff;
      text-transform: uppercase;
    }

    .product-price {
      font-size: 1.4rem;
      font-weight: 300;
      color: #fff;
      margin-bottom: 60px;
      letter-spacing: 0.05em;
    }

    .size-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 16px;
      color: #777;
    }

    .size-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 40px;
    }

    .size-btn {
      padding: 14px 0;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: transparent;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .size-btn:hover { border-color: #fff;
    }

    .size-btn.selected {
      background: #fff;
      color: #000;
      border-color: #fff;
      font-weight: 600;
    }

    .add-to-cart {
      width: 100%;
      background: #fff;
      color: #000;
      border: none;
      padding: 26px 0;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
      margin-bottom: 60px;
    }

    .add-to-cart:hover { background: #eee;
      transform: translateY(-2px);
    }

    .info-accordion {
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .accordion-header {
      padding: 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s ease;
      font-size: 14px;
      line-height: 1.8;
      color: #777;
    }

    .accordion-content p {
      padding-bottom: 24px;
    }

    .accordion-content.open {
      max-height: 500px;
    }

    @media (max-width: 900px) {
      .split-layout {
        flex-direction: column;
      }

      .image-side {
        width: 100%;
        height: 60vh;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .info-side {
        width: 100%;
        padding: 40px 24px 100px 24px;
      }

      .product-title {
        font-size: 1.8rem;
      }

      .cart-drawer {
        width: 100%;
        right: -100%;
      }
    }

    /* CART RESPONSIVE FIX */

  <script>
    // --- Variables that vary per product ---
    const PRODUCT_NAME = "DB-01";
    const PRODUCT_PRICE = 49;
    // ----------------------------------------

    
    
    
    
    
let cart = [];
const cartCount = document.getElementById("cart-count");
const cartDrawer = document.getElementById("cart-dropdown");
const overlay = document.getElementById("cart-overlay");

function loadCart(){
  const stored = localStorage.getItem("cart");
  cart = stored ? JSON.parse(stored) : [];
  updateCart(false);
}

function updateCart(save=true){

  const cartItems = document.getElementById("cart-items");
  const totalPriceEl = document.getElementById("cart-total-price");

  cartItems.innerHTML="";
  let total=0;

  if(cart.length===0){

    cartItems.innerHTML="<p style='font-size:11px;opacity:0.5;'>Cart is empty</p>";

  } else {

    cart.forEach((item,index)=>{

      total+=item.price;

      const div=document.createElement("div");
      div.classList.add("cart-item");

      div.innerHTML=`
      <div>
        <div style="font-size:12px;margin-bottom:5px;">
        ${item.name} (${item.size||"OS"})
        </div>
        <div style="opacity:0.5;">${item.price} USD</div>
      </div>
      <span onclick="removeItem(${index})">✕</span>
      `;

      cartItems.appendChild(div);

    });

  }

  totalPriceEl.innerText=total+" USD";
  cartCount.innerText=cart.length;

  if(save) localStorage.setItem("cart",JSON.stringify(cart));
}

function removeItem(index){
  cart.splice(index,1);
  updateCart();
}

document.getElementById("cart-icon").onclick=()=>{
  cartDrawer.classList.add("show");
  overlay.classList.add("show");
}

overlay.onclick=()=>{
  cartDrawer.classList.remove("show");
  overlay.classList.remove("show");
}

window.addEventListener("pageshow",loadCart);

loadCart();

function addToCart(name,price,size){

cart.push({
name:name,
price:price,
size:size
});

updateCart();

}


  let selectedSize = null;
      if (sizeList.length > 0) {
        sizeList.forEach(p => { if (p.classList.contains('selected')) selectedSize = p.innerText; });
      } else {
        const legacySizes = document.querySelectorAll('.size-btn');
        legacySizes.forEach(p => { if (p.classList.contains('selected')) selectedSize = p.innerText; });
      }

      if (!selectedSize && document.querySelector('.size-row')) { 
         // There are sizes but they selected nothing
         alert('Bitte wähle eine Größe'); 
         return; 
      }

      let product = { name: PRODUCT_NAME, price: PRODUCT_PRICE, size: selectedSize || "One Size", qty: 1 };
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      
      const existingItem = cart.find(i => i.name === PRODUCT_NAME && i.size === (selectedSize || "One Size"));
      if (!existingItem) {
        cart.push(product);
        localStorage.setItem("cart", JSON.stringify(cart));
      }
      
      openCartDrawer();
    }

    let selectedSize = null;
    function selectSize(size, el) {
      selectedSize = size;
      document.querySelectorAll('.size-btn, .size-pill').forEach(btn => btn.classList.remove('selected'));
      el.classList.add('selected');
    }

    if(checkoutBtn){
      checkoutBtn.addEventListener('click', () => {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        if (cart.length === 0) {
          alert('Cart is empty.');
          return;
        }
        window.location.href = 'checkout.html';
      });
    }

    // Initialize UI silently
    loadCart();



    function toggleDescription(){
const desc = document.getElementById("product-description");
const icon = document.getElementById("toggle-icon");

if(desc) desc.classList.toggle("open");

if(desc && desc.classList.contains("open")){
if(icon) icon.innerText = "-";
}else{
if(icon) icon.innerText = "+";
}
}
    }
    
  </script>
<!-- ANTI-ZOOM SCRIPT -->
<script>
let lastTouchEnd = 0;
document.addEventListener('touchend', function (event) {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) {
    event.preventDefault();
  }
  lastTouchEnd = now;
}, false);
</script>
